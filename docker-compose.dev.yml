# Development infrastructure — postgres, redis, clickhouse
# Backend and frontend run locally via pnpm dev:all
# Nginx is managed by the daemon on the host (or skipped in dev)
#
# Usage:
#   pnpm dev:infra        # start containers
#   pnpm dev:all          # start backend + frontend
#   pnpm dev:infra:down   # stop containers

services:
  postgres:
    image: postgres:16-alpine
    container_name: opfield-postgres-dev
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: opfield
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d opfield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opfield-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:26.2.10.10
    container_name: opfield-clickhouse-dev
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: opfield_logs
      CLICKHOUSE_USER: opfield
      CLICKHOUSE_PASSWORD: dev
    volumes:
      - clickhouse_dev_data:/var/lib/clickhouse
      - ./clickhouse-config/opfield-safety.xml:/etc/clickhouse-server/config.d/opfield-safety.xml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user opfield --password dev --query 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  registry:
    image: registry:3
    container_name: opfield-registry-dev
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_SECRET: opfield-development-registry-secret
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_INTERVAL: 10s
      REGISTRY_HEALTH_STORAGEDRIVER_THRESHOLD: "3"
    expose:
      - "5000"
    volumes:
      - registry_dev_data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/v2/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_dev_data:
  redis_dev_data:
  clickhouse_dev_data:
  registry_dev_data:
