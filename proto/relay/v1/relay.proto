syntax = "proto3";

package relay.v1;

option go_package = "github.com/wiolett-industries/gateway/daemon-shared/relayv1";

// TunnelBroker is deliberately resource agnostic. Gateway is the only
// component that maps endpoint and route identifiers to product resources.
service TunnelBroker {
  rpc RegisterEndpoint(stream EndpointControl) returns (stream EndpointControl);
  rpc OpenTunnel(stream TunnelFrame) returns (stream TunnelFrame);
  rpc AcceptTunnel(stream TunnelFrame) returns (stream TunnelFrame);
  // Availability lease coordination (Docker Availability data-plane failover).
  // The relay routes frames by destination_id among connected members and is
  // itself an acceptor. Only identities named by the current signed voter
  // config or a manifest candidate list may use it.
  rpc Coordinate(stream CoordinationFrame) returns (stream CoordinationFrame);
  // Streams this relay's data-path gate view for lease keys: sent on every
  // change and at least once a second. nginx daemons derive Secure Link
  // socket state from it with a TTL of at most the lease term (A8).
  rpc WatchLeaseGates(LeaseGateWatchRequest) returns (stream LeaseGateSnapshot);
}

// RelayAdmin is reachable on the same listener but only by the pinned Gateway
// app service identity.
service RelayAdmin {
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc GetRouteRuntime(RouteRuntimeRequest) returns (RouteRuntimeResponse);
  rpc ApplySnapshot(ApplySnapshotRequest) returns (ApplySnapshotResponse);
  rpc BootstrapPolicyTrust(BootstrapPolicyTrustRequest) returns (BootstrapPolicyTrustResponse);
  // Local combined mode only: replaces pinned policy trust with one key. A remote relay
  // never accepts an unsigned trust change.
  rpc ResetLocalPolicyTrust(ResetLocalPolicyTrustRequest) returns (ResetLocalPolicyTrustResponse);
  rpc ReloadIdentity(ReloadIdentityRequest) returns (ReloadIdentityResponse);
  rpc CommitIdentityRotation(CommitIdentityRotationRequest) returns (CommitIdentityRotationResponse);
  rpc SetDrain(SetDrainRequest) returns (SetDrainResponse);
  // Opens a tunnel with this relay itself as the origin (a witness process
  // the relay supervisor runs reaching availability set members). The first
  // frame is dial; then the stream carries data like OpenTunnel. Only routes
  // whose source is this relay instance (source_kind relay_instance) are
  // dialled, under their target endpoint's lease gate and session limits.
  // Relays advertise relay_dial_route_v1.
  rpc DialRoute(stream TunnelFrame) returns (stream TunnelFrame);
}

message SignedGrant {
  string key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message EndpointControl {
  oneof payload {
    RegisterEndpoint register = 1;
    RenewEndpoint renew = 2;
    EndpointRegistered registered = 3;
    IncomingTunnel incoming = 4;
    RelayError error = 5;
  }
}

// How an endpoint registration takes traffic (D6, D7). Endpoints built before
// the field existed send UNSPECIFIED: a lease-bound registration then exists
// only while this relay's lease gate is open for it, and serves traffic.
// DORMANT and SERVING registrations are kept whatever the lease gate says;
// only a SERVING one receives tunnels, and a lease-bound one only while the
// gate is open. Availability members register DORMANT on every assigned
// relay (standbys, and holders whose workload is not ready yet), so a
// successor is reachable through every relay the moment it is ready.
enum EndpointServingState {
  ENDPOINT_SERVING_STATE_UNSPECIFIED = 0;
  ENDPOINT_SERVING_STATE_DORMANT = 1;
  ENDPOINT_SERVING_STATE_SERVING = 2;
  // The endpoint's daemon is shutting down to restart (service restart,
  // update) and serves again once it registers anew (B-13). Sent as a renewal
  // only to relays advertising endpoint_restart_v1: such a relay keeps the
  // registration for a short grace after its stream ends, answers new tunnels
  // with a retryable "target endpoint is restarting" and reports the holder's
  // endpoint RESTARTING. A relay without it would read the value as DORMANT.
  ENDPOINT_SERVING_STATE_RESTARTING = 3;
}

message RegisterEndpoint {
  SignedGrant grant = 1;
  EndpointServingState state = 2;
}
message RenewEndpoint {
  SignedGrant grant = 1;
  // A renewal may change the serving state; the grant is re-verified as on
  // every renewal.
  EndpointServingState state = 2;
}
message EndpointRegistered {
  string endpoint_id = 1;
  int64 grant_expires_at_unix = 2;
}
message IncomingTunnel {
  string session_id = 1;
  string accept_token = 2;
  int64 accept_expires_at_unix = 3;
  // The route this relay admitted the tunnel for, from the policy it holds.
  // Unset from relays built before the field existed.
  IncomingTunnelRoute route = 4;
}

// An endpoint refuses a route Gateway revoked while this relay missed the
// revoking policy; the relay is trusted to report what it admitted, not to
// hold current policy.
message IncomingTunnelRoute {
  string route_id = 1;
  uint64 route_generation = 2;
  string source_kind = 3;
  string source_id = 4;
  uint64 assignment_generation = 5;
}

message TunnelFrame {
  oneof payload {
    OpenTunnel open = 1;
    AcceptTunnel accept = 2;
    TunnelReady ready = 3;
    TunnelData data = 4;
    TunnelHalfClose half_close = 5;
    TunnelClose close = 6;
    RelayError error = 7;
    // RelayAdmin.DialRoute only: the route to dial.
    DialRoute dial = 8;
  }
}

message OpenTunnel { SignedGrant grant = 1; }
message DialRoute {
  string route_id = 1;
  // 0 dials the route of the policy without assignment scope.
  uint64 assignment_generation = 2;
}
message AcceptTunnel { string accept_token = 1; }
message TunnelReady { uint32 max_frame_bytes = 1; }
message TunnelData { bytes data = 1; }
message TunnelHalfClose {}
message TunnelClose {}
message RelayError {
  string code = 1;
  string message = 2;
}

message PublicKey {
  string key_id = 1;
  bytes public_key = 2;
}

enum RelayMode {
  RELAY_MODE_UNSPECIFIED = 0;
  RELAY_MODE_LOCAL_COMBINED = 1;
  RELAY_MODE_REMOTE_DATA_ONLY = 2;
}

message PolicySigningKey {
  string key_id = 1;
  bytes public_key = 2;
  string public_key_fingerprint = 3;
  string status = 4; // "active" or "verification_only"
  int64 valid_from_unix = 5;
  int64 verify_until_unix = 6;
}

message EndpointPolicy {
  string endpoint_id = 1;
  uint64 generation = 2;
  string subject_kind = 3;
  string subject_id = 4;
  string certificate_sha256 = 5;
  uint32 max_concurrent_sessions = 6;
  string pool_id = 7;
  string relay_instance_id = 8;
  uint64 assignment_generation = 9;
  // Availability policy whose data-plane lease gates this endpoint. When set,
  // the relay admits the registration and its tunnels only while its lease
  // gate is open for subject_id (A2.4, A8, A11). Empty keeps legacy admission.
  string lease_policy_id = 10;
  // Relay-local endpoint (subject_kind relay_instance, subject_id this
  // relay's instance id): the relay serves tunnels to it itself, by dialling
  // 127.0.0.1:relay_local_port, a port of the witness range (39400-39499).
  // No daemon registers it. Relays advertise relay_local_endpoints_v1.
  uint32 relay_local_port = 11;
}

message RoutePolicy {
  string route_id = 1;
  uint64 generation = 2;
  string source_kind = 3;
  string source_id = 4;
  string source_certificate_sha256 = 5;
  string target_endpoint_id = 6;
  uint32 max_concurrent_sessions = 7;
  uint32 max_frame_bytes = 8;
  // Proxy Secure Links intentionally have no fixed idle timeout. Existing
  // routes keep the relay default when this field is false.
  bool disable_idle_timeout = 9;
  // Product classification used only for overload admission and reporting.
  // The relay remains unaware of concrete Gateway resource identifiers.
  string traffic_class = 10;
  uint64 assignment_generation = 11;
  // Availability policy whose lease gates the route's source, for managed-DB
  // routes of lease-mode placements: tunnels open only while the lease gate
  // is open for source_id. Empty keeps legacy admission.
  string lease_policy_id = 12;
}

message AdmissionPolicy {
  bool enabled = 1;
  uint32 proxy_target_pressure_percent = 2;
  uint32 database_reserve_percent = 3;
  uint32 hard_pressure_percent = 4;
}

message PolicyEnvelopePayload {
  uint32 schema_version = 1;
  string gateway_instance_id = 2;
  string pool_id = 3;
  string relay_instance_id = 4;
  uint64 revision = 5;
  int64 issued_at_unix = 6;
  int64 expires_at_unix = 7;
  repeated PublicKey grant_public_keys = 8;
  repeated EndpointPolicy endpoints = 9;
  repeated RoutePolicy routes = 10;
  AdmissionPolicy admission_policy = 11;
  repeated string capabilities = 12;
  repeated PolicySigningKey policy_signing_keys = 13;
  // Availability lease (T3): the signed voter config and every lease-mode
  // policy manifest, plus the policy key rotation chain that lets a relay
  // verify blocks signed by a key it has not pinned yet (A4, A14).
  repeated LeaseSignedBlock lease_blocks = 40;
  repeated LeasePolicyKeyRotation lease_key_rotations = 41;
}

message SignedPolicyEnvelope {
  string signing_key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message ApplySnapshotRequest {
  uint64 revision = 1;
  string gateway_instance_id = 2;
  repeated PublicKey public_keys = 3;
  repeated EndpointPolicy endpoints = 4;
  repeated RoutePolicy routes = 5;
  AdmissionPolicy admission_policy = 6;
  // Pool-aware relays consume this signed envelope. Legacy local callers keep
  // fields 1-6 byte-for-field compatible until capability negotiation succeeds.
  SignedPolicyEnvelope signed_envelope = 7;
}

message ApplySnapshotResponse {
  uint64 applied_revision = 1;
  bool unchanged = 2;
  string pool_id = 3;
  string relay_instance_id = 4;
  int64 policy_expires_at_unix = 5;
}

message BootstrapPolicyTrustRequest {
  string key_id = 1;
  bytes public_key = 2;
  string public_key_fingerprint = 3;
}
message BootstrapPolicyTrustResponse {
  string key_id = 1;
  string public_key_fingerprint = 2;
  bool unchanged = 3;
}
message ResetLocalPolicyTrustRequest {
  string key_id = 1;
  bytes public_key = 2;
  string public_key_fingerprint = 3;
}
message ResetLocalPolicyTrustResponse {
  string key_id = 1;
  string public_key_fingerprint = 2;
  repeated string replaced_key_ids = 3;
}

message HealthRequest {}
message HealthResponse {
  string build_version = 1;
  uint32 protocol_major = 2;
  uint64 applied_revision = 3;
  repeated string key_ids = 4;
  uint64 registered_endpoints = 5;
  uint64 active_tunnels = 6;
  bool liveness = 7;
  bool readiness = 8;
  string reason = 9;
  uint64 active_proxy_tunnels = 10;
  uint64 active_database_tunnels = 11;
  uint64 throttled_proxy_total = 12;
  uint64 throttled_database_total = 13;
  uint32 pressure_percent = 14;
  uint32 cpu_pressure_percent = 15;
  uint32 memory_pressure_percent = 16;
  uint32 fd_pressure_percent = 17;
  string admission_state = 18;
  uint64 memory_rss_bytes = 19;
  uint64 heap_in_use_bytes = 20;
  uint64 memory_limit_bytes = 21;
  uint64 open_file_descriptors = 22;
  uint64 file_descriptor_limit = 23;
  string pool_id = 24;
  string relay_instance_id = 25;
  RelayMode mode = 26;
  int64 policy_expires_at_unix = 27;
  repeated string capabilities = 28;
  bool draining = 29;
  repeated AssignmentTunnelCount assignment_tunnels = 30;
  repeated string policy_key_ids = 31;
  // Present when the relay runs availability lease coordination; the same
  // shape as gateway.v1 AvailabilityLeaseReport.
  AvailabilityLeaseReport availability_lease = 32;
}

message AssignmentTunnelCount {
  string endpoint_id = 1;
  uint64 assignment_generation = 2;
  uint64 active_tunnels = 3;
}

message RouteRuntimeRequest { string route_id = 1; }
message RouteRuntimeResponse {
  string route_id = 1;
  uint64 active_tunnels = 2;
  uint64 opened_total = 3;
  uint64 completed_total = 4;
  uint64 failed_total = 5;
  uint64 throttled_total = 6;
  uint64 source_to_target_bytes = 7;
  uint64 target_to_source_bytes = 8;
  uint64 setup_latency_p95_microseconds = 9;
  uint64 average_duration_milliseconds = 10;
  int64 last_activity_unix_milliseconds = 11;
  int64 metrics_since_unix_milliseconds = 12;
}

message ReloadIdentityRequest { string operation_id = 1; }
message ReloadIdentityResponse {
  bool reloaded = 1;
  // Fingerprints ("sha256:<hex>") of the identity the relay loaded, so Gateway
  // confirms a rotation only once the relay serves the files it installed.
  // Empty from relays built before these fields existed.
  string external_certificate_sha256 = 2;
  string relay_client_certificate_sha256 = 3;
  string app_client_certificate_sha256 = 4;
}
message CommitIdentityRotationRequest { string operation_id = 1; }
message CommitIdentityRotationResponse { bool committed = 1; }
message SetDrainRequest {
  bool draining = 1;
  string operation_id = 2;
  bool force_disconnect = 3;
}
message SetDrainResponse {
  bool draining = 1;
  uint64 disconnected_tunnels = 2;
}

// ---------------------------------------------------------------------------
// Availability lease coordination (Docker Availability data-plane failover).
// Protocol logic lives in daemon-shared/availabilitylease; see its doc.go for
// the state machines and how every message below is used. Frames travel over
// the relay Coordinate stream. Relays route them by destination_id and cannot
// forge them: the payload is signed with the sender's ECDSA P-256 identity key.
// ---------------------------------------------------------------------------

enum LeasePolicyMode {
  LEASE_POLICY_MODE_UNSPECIFIED = 0;
  LEASE_POLICY_MODE_FAILOVER = 1;
  LEASE_POLICY_MODE_REPLICATED = 2;
}

enum LeasePartitionMode {
  LEASE_PARTITION_MODE_UNSPECIFIED = 0;
  LEASE_PARTITION_MODE_STRICT = 1;
  LEASE_PARTITION_MODE_AVAILABLE = 2;
}

enum LeaseMemberRole {
  LEASE_MEMBER_ROLE_UNSPECIFIED = 0;
  LEASE_MEMBER_ROLE_RELAY = 1;
  LEASE_MEMBER_ROLE_DAEMON = 2;
}

enum LeaseBlockKind {
  LEASE_BLOCK_KIND_UNSPECIFIED = 0;
  LEASE_BLOCK_KIND_MANIFEST = 1;
  // 2 was a cluster-wide voter config; voters are per policy (A18).
  reserved 2;
}

enum LeaseNackReason {
  LEASE_NACK_REASON_UNSPECIFIED = 0;
  LEASE_NACK_REASON_BALLOT_TOO_LOW = 1;
  LEASE_NACK_REASON_HELD = 2;
  LEASE_NACK_REASON_RESERVED = 3;
  LEASE_NACK_REASON_RELEASED = 4;
  LEASE_NACK_REASON_STALE_EPOCH = 5;
  LEASE_NACK_REASON_STALE_MANIFEST = 6;
  LEASE_NACK_REASON_ACCEPTOR_BEHIND = 7;
  LEASE_NACK_REASON_LEASE_CLOSED = 8;
  LEASE_NACK_REASON_NOT_CANDIDATE = 9;
  LEASE_NACK_REASON_UNKNOWN_POLICY = 10;
  // Graceful close: the acceptor does not confirm the close to this holder
  // (it is not the slot's retained holder, or another proposer superseded it).
  LEASE_NACK_REASON_RETAIN_REFUSED = 11;
  // Stateful keys (availability_lease_v3): the propose does not echo a promise
  // this acceptor issued in its current incarnation (it restarted or lost its
  // state since), so it neither accepts nor leaves UNKNOWN (AS1).
  LEASE_NACK_REASON_NO_PROMISE = 12;
  // Stateful keys: the proposed holder state is missing, too large, cannot be
  // decoded, or names another holder than the ballot's proposer.
  LEASE_NACK_REASON_STATE_INVALID = 13;
}

enum LeaseKeyState {
  LEASE_KEY_STATE_UNSPECIFIED = 0;
  LEASE_KEY_STATE_FREE = 1;
  LEASE_KEY_STATE_HELD = 2;
  LEASE_KEY_STATE_RESERVED = 3;
  LEASE_KEY_STATE_ABSTAINING = 4;
  LEASE_KEY_STATE_CLOSED = 5;
}

enum LeaseReleasePhase {
  LEASE_RELEASE_PHASE_UNSPECIFIED = 0;
  // Sent to relays first: close the data-path gate for the ballot and ack.
  LEASE_RELEASE_PHASE_RELINQUISH = 1;
  // Sent to acceptors once every relay acked or the gate window elapsed.
  LEASE_RELEASE_PHASE_FINAL = 2;
}

message CoordinationFrame {
  // Routing only; both are repeated inside the signed payload.
  string destination_id = 1;
  string sender_id = 2;
  // Encoded LeaseBatch.
  bytes payload = 3;
  // ECDSA P-256 ASN.1 signature over SHA-256("gateway-availability-lease/frame/v1" 0x00 || payload).
  bytes signature = 4;
  // During an identity-key rotation the sender also signs the same bytes
  // with its previous key. A frame is valid when any signature verifies
  // under any key listed for the sender in any adopted manifest.
  repeated bytes additional_signatures = 5;
}

message LeaseBatch {
  string message_id = 1;
  string sender_id = 2;
  uint64 sender_incarnation = 3;
  string destination_id = 4;
  repeated LeaseItem items = 5;
  // Signed manifests and voter configs forwarded so lagging peers adopt them (A4).
  repeated LeaseSignedBlock blocks = 6;
  // Policy key rotation chain for the forwarded blocks (A14).
  repeated LeasePolicyKeyRotation key_rotations = 7;
  // Peer-time freeze detection (D4). The sender's lease clock
  // (CLOCK_BOOTTIME on Linux) in milliseconds when it sealed the batch, and
  // an id of that clock's origin (derived from the kernel boot id, so it
  // changes whenever the clock may be discontinuous). Receivers track the
  // offset between their own lease clock and each sender's; a drop beyond the
  // skew budget means the receiver's host was frozen since the sender's
  // previous frame. The echo fields return the destination's own clock from
  // the newest batch the sender received from it, and how long the sender
  // held it, so the destination bounds this batch's delay by the round trip
  // (only such batches form the reference). A batch may carry no items at
  // all: relays and daemons send such clock beacons every second. All zero
  // from senders that predate availability_lease_v2.
  uint64 sender_clock_ms = 8;
  fixed64 sender_clock_origin = 9;
  uint64 echo_clock_ms = 10;
  fixed64 echo_clock_origin = 11;
  uint64 echo_age_ms = 12;
}

message LeaseKey {
  string policy_id = 1;
  uint32 slot = 2;
}

// Ordered by (round, incarnation, proposer_id).
message LeaseBallot {
  uint64 round = 1;
  uint64 incarnation = 2;
  string proposer_id = 3;
}

message LeaseItem {
  oneof body {
    LeasePrepare prepare = 1;
    LeasePromise promise = 2;
    LeasePropose propose = 3;
    LeaseAccepted accepted = 4;
    LeaseNack nack = 5;
    LeaseCommit commit = 6;
    LeaseRelease release = 7;
    LeaseReleaseAck release_ack = 8;
    LeaseQuery query = 9;
    LeaseStatus status = 10;
    LeaseRetain retain = 11;
    LeaseRetained retained = 12;
  }
}

message LeasePrepare {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  uint64 epoch = 3;
  uint64 manifest_version = 4;
}

message LeasePromise {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  // Nonce the proposer echoes in its propose; anchors the relay gate (A11).
  uint64 echo = 3;
  // True while the acceptor abstains (A3) or does not vote: never counted.
  bool shadow = 4;
  uint64 acceptor_incarnation = 5;
  // Stateful keys only (availability_lease_v3): the acceptor's highest
  // accepted ballot and state (Paxos phase 1b), or UNKNOWN. Absent means
  // UNKNOWN, so a v2 acceptor never counts toward a KNOWN majority.
  LeaseAcceptedState accepted = 6;
}

message LeasePropose {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  uint64 epoch = 3;
  uint64 manifest_version = 4;
  uint64 echo = 5;
  // Stateful keys only: the proposed LeaseHolderState, encoded. Its sha256 is
  // what the accept v2 statement covers; the transition id travels inside.
  bytes state = 6;
}

// A signed accept. The signature covers the canonical accept statement
// described in availabilitylease/doc.go, so accepts form a forwardable QC.
message LeaseAccepted {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  uint64 epoch = 3;
  uint64 manifest_version = 4;
  string acceptor_id = 5;
  uint64 acceptor_incarnation = 6;
  bytes signature = 7;
  // Signature of the same statement with the acceptor's previous identity
  // key while it rotates keys; any one verifying signature suffices.
  repeated bytes additional_signatures = 8;
  // Stateful keys only: sha256 of the accepted propose's state. Its presence
  // selects the accept v2 statement (doc.go).
  bytes state_hash = 9;
}

message LeaseNack {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  LeaseNackReason reason = 3;
  LeaseBallot promised = 4;
  string holder_id = 5;
  // Latest valid commit the acceptor stores (A13).
  LeaseCommit latest_commit = 6;
  uint64 epoch = 7;
  uint64 manifest_version = 8;
  uint64 acceptor_incarnation = 9;
}

// Commit certificate: accepts from a majority of every quorum set of the epoch (A11).
message LeaseCommit {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  uint64 epoch = 3;
  uint64 manifest_version = 4;
  repeated LeaseAccepted quorum = 5;
  // Stateful keys only: the certified LeaseHolderState bytes; every accept of
  // the quorum covers their sha256.
  bytes state = 6;
}

message LeaseRelease {
  LeaseKey key = 1;
  // Highest ballot the releasing holder ever issued for the key (A6).
  LeaseBallot ballot = 2;
  LeaseReleasePhase phase = 3;
  // Designated successor (D9); empty opens the key to anyone.
  string successor_id = 4;
}

message LeaseReleaseAck {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  LeaseReleasePhase phase = 3;
}

message LeaseQuery {
  repeated LeaseKey keys = 1;
}

// Graceful close. The holder of a slot that a closed manifest names in
// retained[] asks every member to confirm the close to it, every second until
// a majority of every quorum set of the closed manifest confirmed (or refused).
message LeaseRetain {
  LeaseKey key = 1;
  // The holder's last committed ballot.
  LeaseBallot ballot = 2;
  uint64 epoch = 3;
  // Version of the closed manifest the holder adopted.
  uint64 manifest_version = 4;
}

// CLOSED_RETAINED: the acceptor durably adopted the closed manifest (it refuses
// every acquisition of the policy's keys) and the sender is the slot's retained
// holder. Refusals are LeaseNack (RETAIN_REFUSED for anyone else or a holder
// the acceptor knows was superseded; STALE_MANIFEST / ACCEPTOR_BEHIND as for
// proposals).
message LeaseRetained {
  LeaseKey key = 1;
  LeaseBallot ballot = 2;
  uint64 epoch = 3;
  uint64 manifest_version = 4;
  uint64 acceptor_incarnation = 5;
}

message LeaseStatus {
  LeaseKey key = 1;
  LeaseKeyState state = 2;
  string holder_id = 3;
  LeaseBallot promised = 4;
  LeaseCommit latest_commit = 5;
  uint64 epoch = 6;
  uint64 manifest_version = 7;
  // Reserved-for holder while state is RESERVED (bootstrap or successor).
  string reserved_for = 8;
  // Stateful keys only: as LeasePromise.accepted, so candidates evaluate
  // eligibility before they send a prepare.
  LeaseAcceptedState accepted = 9;
}

// Stateful keys only (availability_lease_v3). An acceptor's memory of a key:
// UNKNOWN (known = false) when its store was created fresh, it has no accepted
// record for the key, or the record predates its adoption of the policy's
// current voter set as a new voter (AS1).
message LeaseAcceptedState {
  bool known = 1;
  // Highest ballot this acceptor accepted as a voter and the state it carried.
  LeaseBallot ballot = 2;
  bytes state = 3;
  // The proposer of ballot released it (final release, A6) as far as this
  // acceptor knows, and the successor that release designated.
  bool released = 4;
  string released_successor_id = 5;
  // Voter epoch the accept was made under.
  uint64 epoch = 6;
}

// The certified value of a stateful lease key (availability_lease_v3). The
// library maintains every field but value, which is the application's state
// (opaque to relays, at most 1024 bytes). The encoded bytes are hashed as
// carried; nobody re-encodes them.
message LeaseHolderState {
  bytes value = 1;
  // Proposer of the ballot that proposed this state.
  string holder_id = 2;
  // Set by every acquisition; cleared by the holder's Promoted transition.
  bool pending_promotion = 3;
  // Last holder whose Promoted transition was certified.
  string promoted_holder_id = 4;
  // Incremented on every change of the state.
  uint64 generation = 5;
  // Id of the last application transition applied to value; empty after an
  // acquisition or bootstrap.
  string transition_id = 6;
  // Set by a forced acquisition (AS10); kept until the next Promoted transition.
  LeaseForcedMarker forced = 7;
}

message LeaseForcedMarker {
  string operation_id = 1;
  // Highest commit ballot the operator saw when forcing.
  LeaseBallot over = 2;
  string holder_id = 3;
  // Highest KNOWN accepted ballot the forced state replaced; empty when none.
  LeaseBallot base = 4;
}

// Signed by the relay policy signing key (Ed25519) over
// "gateway-availability-lease/manifest/v1" 0x00 || payload.
message LeaseSignedBlock {
  string signing_key_id = 1;
  LeaseBlockKind kind = 2;
  bytes payload = 3;
  bytes signature = 4;
}

message LeaseCandidate {
  string id = 1;
  // PKIX DER ECDSA P-256 identity public key.
  bytes public_key = 2;
}

message LeaseBootstrapSlot {
  uint32 slot = 1;
  string holder_id = 2;
}

message LeaseManifest {
  uint32 schema_version = 1;
  string policy_id = 2;
  uint64 manifest_version = 3;
  LeasePolicyMode mode = 4;
  LeasePartitionMode partition_mode = 5;
  uint32 slots = 6;
  // Ordered: index is the takeover rank (D5).
  repeated LeaseCandidate candidates = 7;
  string spec_fingerprint = 8;
  // Per-policy voter epoch (A18). Bumped whenever members or quorum_sets
  // change; proposals carry it as their epoch.
  uint64 voter_epoch = 9;
  // Lease-closed manifest (A5): acceptors refuse every proposal, holders fence.
  bool closed = 10;
  // Bootstrap reservation (A5); keep it in every version until the holder acked.
  uint64 bootstrap_id = 11;
  repeated LeaseBootstrapSlot bootstrap = 12;
  // Must be 0 or 30000; the timing constants are fixed.
  uint32 lease_term_ms = 13;
  // The policy's coordination members (A18): its voters (candidate hosts in
  // rank order plus witnesses, deduplicated by host, at most 7) and every
  // relay that serves the policy. Relays outside the quorum sets only keep
  // shadow accepts for the data-path gate. Member ids are unique.
  repeated LeaseMember members = 14;
  // One quorum set when settled; two (old, new) during a joint-consensus
  // voter change (D2, A4). A quorum is a majority of every set.
  repeated LeaseQuorumSet quorum_sets = 15;
  // Graceful close (closed manifests only). Per slot, the holder that keeps
  // its copy running without a lease once a majority of every quorum set
  // confirmed the close to it (LeaseRetained). Gateway names the committed
  // holder it sees for the slot when it closes; an unheld slot has no entry.
  // A holder that is not named, or cannot reach such a majority, fences.
  repeated LeaseRetainedSlot retained = 16;
  // Every key carries a certified holder state (availability_lease_v3; every
  // participant must advertise it). Strict partition mode only: the library
  // rejects AVAILABLE for a stateful manifest (AS8).
  bool stateful = 17;
}

message LeaseRetainedSlot {
  uint32 slot = 1;
  // Candidate id of the holder; it must be listed in candidates as well.
  string holder_id = 2;
  // The holder's committed ballot Gateway saw; empty when it saw none (a
  // reserved bootstrap holder whose commit may have raced the close). Acceptors
  // refuse to confirm when they know a commit, open lease or accept of another
  // proposer above it and above every ballot of the holder they know.
  LeaseBallot ballot = 3;
}

message LeaseMember {
  string id = 1;
  bytes public_key = 2;
  LeaseMemberRole role = 3;
}

message LeaseQuorumSet {
  repeated string voter_ids = 1;
}

// A14: key_id introduced by previous_key_id. The signature is Ed25519 by the
// previous key over "gateway-availability-lease/key-rotation/v1" 0x00 ||
// be32(len(key_id)) || key_id || public_key.
message LeasePolicyKeyRotation {
  string previous_key_id = 1;
  string key_id = 2;
  bytes public_key = 3;
  string public_key_fingerprint = 4;
  bytes signature = 5;
}

// ---------------------------------------------------------------------------
// Relay availability lease views (health and nginx gate watch).
// ---------------------------------------------------------------------------

message LeaseGateWatchRequest {
  // Empty watches every policy the relay knows.
  repeated string policy_ids = 1;
}

message LeaseGateSnapshot {
  string relay_member_id = 1;
  uint64 relay_incarnation = 2;
  repeated LeaseGateView gates = 3;
}

// The relay data-path gate for one lease key.
message LeaseGateView {
  string policy_id = 1;
  uint32 slot = 2;
  // False when the relay has no lease-mode manifest for the policy (unknown or
  // lease closed); legacy admission applies then.
  bool lease_mode = 3;
  bool open = 4;
  string holder_id = 5;
  LeaseBallot ballot = 6;
  // Local milliseconds until the gate closes unless refreshed. Receivers
  // treat the view as closed after min(remaining_ms, 30000) from receipt.
  uint64 remaining_ms = 7;
  string reason = 8;
  // Whether the holder's endpoint takes traffic through this relay (D6): READY
  // when one of its lease-bound endpoints for the policy is registered SERVING
  // (or by an endpoint built before serving states), NOT_READY otherwise.
  // UNKNOWN from relays built before the field existed; receivers then open on
  // the gate alone.
  LeaseHolderEndpoint holder_endpoint = 9;
}

enum LeaseHolderEndpoint {
  LEASE_HOLDER_ENDPOINT_UNKNOWN = 0;
  LEASE_HOLDER_ENDPOINT_NOT_READY = 1;
  LEASE_HOLDER_ENDPOINT_READY = 2;
  // The holder's endpoint served and its daemon is restarting (B-13): nginx
  // keeps the member socket open and holds new connections until it serves
  // again, unless another member of the policy is READY. Receivers built
  // before the value existed open on the gate alone.
  LEASE_HOLDER_ENDPOINT_RESTARTING = 3;
}

// The messages below mirror gateway.v1 AvailabilityLeaseReport and its parts
// field for field (same names, numbers and types), so the relay supervisor
// forwards the report as RelayRuntimeStatus.availability_lease by re-decoding
// the bytes, and the Gateway ingests relay views like daemon reports.
// Numbers from 20 up are relay-only additions; gateway.v1 keeps them as
// unknown fields.

message AvailabilityLeaseReport {
  // Relay instance id.
  string member_id = 1;
  // PKIX DER ECDSA P-256 public key that signs this relay's frames (the
  // external server certificate key).
  bytes identity_public_key = 2;
  uint64 incarnation = 3;
  // Voters are per policy (A18): relays leave this 0 and report each
  // policy's voter epoch in manifests[].voter_epoch.
  uint64 epoch = 4;
  repeated string trusted_policy_key_ids = 5;
  // One entry per policy manifest the relay holds: the per-policy view.
  repeated AvailabilityLeaseManifestAck manifests = 6;
  // Daemons only; empty on relays.
  repeated AvailabilityLeaseHeld held = 7;
  repeated AvailabilityLeaseKeyView acceptor = 8;
  bool acceptor_abstaining = 9;
  // Daemons only.
  bool watchdog_ready = 10;
  // Daemons only.
  repeated AvailabilityLeaseEvent events = 11;
  // Daemons only.
  uint64 lease_revision = 12;
  reserved 20;
  repeated string connected_member_ids = 21;
  // Relay-only: last detected host suspend (A17); zero when none.
  int64 last_suspend_unix_ms = 22;
  uint64 last_suspend_duration_ms = 23;
}

message AvailabilityLeaseManifestAck {
  string policy_id = 1;
  uint64 manifest_version = 2;
  bool closed = 3;
  // Relay-only per-policy voter view (A18): the adopted voter epoch (the
  // per-policy A4 ack), whether this relay is in a quorum set (the policy's
  // witness) or only a non-voting member keeping shadow accepts.
  uint64 voter_epoch = 20;
  bool voter = 21;
  bool member = 22;
}

message AvailabilityLeaseHeld {
  string policy_id = 1;
  uint32 slot = 2;
  string role = 3;
  AvailabilityLeaseBallot ballot = 4;
  uint64 epoch = 5;
  uint64 manifest_version = 6;
  string placement_id = 7;
  uint64 placement_generation = 8;
  // Daemons only: graceful close (see gateway.v1).
  bool retained = 9;
}

message AvailabilityLeaseKeyView {
  string policy_id = 1;
  uint32 slot = 2;
  // free, held, reserved, abstaining or closed.
  string state = 3;
  string holder_id = 4;
  string reserved_for = 5;
  AvailabilityLeaseBallot promised = 6;
  AvailabilityLeaseBallot committed = 7;
  uint64 epoch = 8;
  uint64 manifest_version = 9;
  // The data-path gate is open for holder_id (A11, A15, A17).
  bool gate_open = 10;
  // Relay-only gate details.
  string gate_holder_id = 20;
  AvailabilityLeaseBallot gate_ballot = 21;
  string gate_reason = 22;
  uint64 gate_remaining_ms = 23;
  // This relay does not vote for the key: restart abstention or not in a
  // quorum set (shadow accepts only).
  bool abstaining = 24;
  // When this member first stored a commit of the committed ballot's
  // proposer (its wall clock, Unix ms): the takeover time the Gateway records
  // for a holder change it learns later, for example after it was down
  // (N-5). Zero when unknown.
  int64 holder_since_unix_ms = 25;
  // Stateful keys only (availability_lease_v3): whether this acceptor's
  // memory of the key is KNOWN, the ballot it last accepted and the sha256 of
  // that state ("sha256:<hex>"), and the hash of the latest commit's state.
  // The state bytes are never reported.
  bool stateful = 26;
  bool state_known = 27;
  string state_hash = 28;
  AvailabilityLeaseBallot accepted = 29;
  string committed_state_hash = 30;
}

message AvailabilityLeaseBallot {
  uint64 round = 1;
  uint64 incarnation = 2;
  string proposer_id = 3;
}

message AvailabilityLeaseEvent {
  string kind = 1;
  string policy_id = 2;
  uint32 slot = 3;
  AvailabilityLeaseBallot ballot = 4;
  string successor_id = 5;
  string reason = 6;
  int64 at_unix_ms = 7;
}
