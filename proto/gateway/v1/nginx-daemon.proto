syntax = "proto3";
package gateway.v1;

option go_package = "github.com/wiolett-industries/gateway/daemon-shared/gatewayv1";

// ─── Node Enrollment ────────────────────────────────────────────────

service NodeEnrollment {
  // Initial enrollment: daemon presents PSK token, receives mTLS certs
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Certificate renewal: daemon presents current cert, gets new one
  rpc RenewCertificate(RenewCertRequest) returns (RenewCertResponse);
}

message EnrollRequest {
  string token = 1;
  string hostname = 2;
  string nginx_version = 3;
  string os_info = 4;
  string daemon_version = 5;
  string daemon_type = 6;     // "nginx", "monitoring", etc.
  // Opaque, installer-persisted physical host identity shared by colocated roles.
  string host_identity_id = 7;
}

message EnrollResponse {
  string node_id = 1;
  bytes ca_certificate = 2;
  bytes client_certificate = 3;
  bytes client_key = 4;
  int64 cert_expires_at = 5;
  string host_identity_id = 6;
  string relay_pool_id = 7;
  string relay_instance_id = 8;
  string policy_signing_key_id = 9;
  bytes policy_signing_public_key = 10;
  string policy_signing_public_key_fingerprint = 11;
  bytes relay_server_certificate = 12;
  bytes relay_server_key = 13;
  string relay_server_identity = 14;
}

message RenewCertRequest {
  string node_id = 1;
}

message RenewCertResponse {
  bytes client_certificate = 1;
  bytes client_key = 2;
  int64 cert_expires_at = 3;
  bytes relay_server_certificate = 4;
  bytes relay_server_key = 5;
  string relay_server_identity = 6;
}

// ─── Main Control Channel ───────────────────────────────────────────

service NodeControl {
  // Bidirectional stream: daemon connects, Gateway pushes commands
  rpc CommandStream(stream DaemonMessage) returns (stream GatewayCommand);
}

// Internal request path used only by an enrolled nginx daemon to exchange and
// validate maintenance access credentials for its local nginx listener.
service MaintenanceAccess {
  rpc Redeem(MaintenanceAccessRedeemRequest) returns (MaintenanceAccessReply);
}

message MaintenanceAccessRedeemRequest {
  string host_id = 1;
  string code = 2;
}

message MaintenanceAccessReply {
  bool allowed = 1;
  string session_token = 2;
}

// Dedicated large-artifact transport. Docker daemons connect over the same
// mutually authenticated channel as NodeControl, but artifacts never share the
// bounded command result envelope.
service MigrationTransfer {
  rpc Transfer(stream MigrationTransferMessage) returns (stream MigrationTransferControl);
}

// Messages FROM daemon TO Gateway
message DaemonMessage {
  oneof payload {
    RegisterMessage register = 1;
    CommandResult command_result = 2;
    HealthReport health_report = 3;
    StatsReport stats_report = 4;
    DaemonLogEntry daemon_log = 5;
    ExecOutput exec_output = 6;
    DockerRuntimeStatus docker_runtime_status = 7;
    RelayRuntimeStatus relay_runtime_status = 8;
    DockerBuildEvent docker_build_event = 9;
  }
}

// Daemon's own operational logs (startup, connections, errors, command execution)
message DaemonLogEntry {
  string timestamp = 1;
  string level = 2;
  string message = 3;
  string component = 4;
  map<string, string> fields = 5;
}

message RegisterMessage {
  string node_id = 1;
  string hostname = 2;
  string nginx_version = 3;
  string config_version_hash = 4;
  string daemon_version = 5;
  int64 nginx_uptime_seconds = 6;
  bool nginx_running = 7;
  // Static system info
  string cpu_model = 8;
  int32 cpu_cores = 9;
  string architecture = 10;
  string kernel_version = 11;
  string daemon_type = 12;       // "nginx", "monitoring", etc.
  repeated string capabilities = 13;
  DockerRuntimeStatus docker_runtime_status = 14;
  string host_identity_id = 15;
  string relay_instance_id = 16;
  reserved 17;
  // The version of the launcher process the daemon runs under; empty for a
  // launcher that predates reporting it. Its features are capabilities
  // (launcher_listener_keep_v1, launcher_self_update_v1).
  string launcher_version = 18;
}

message CommandResult {
  string command_id = 1;
  bool success = 2;
  string error = 3;
  string detail = 4;
  bytes data = 5;
}

message HealthReport {
  bool nginx_running = 1;
  bool config_valid = 2;
  int64 nginx_uptime_seconds = 3;
  int32 worker_count = 4;
  string nginx_version = 5;
  double cpu_percent = 6;
  int64 memory_bytes = 7;
  int64 disk_free_bytes = 8;
  int64 timestamp = 9;
  // System
  double load_average_1m = 10;
  double load_average_5m = 11;
  double load_average_15m = 12;
  int64 system_memory_total_bytes = 13;
  int64 system_memory_used_bytes = 14;
  int64 system_memory_available_bytes = 15;
  int64 swap_total_bytes = 16;
  int64 swap_used_bytes = 17;
  int64 system_uptime_seconds = 18;
  int64 open_file_descriptors = 19;
  int64 max_file_descriptors = 20;
  // Disk
  repeated DiskMount disk_mounts = 21;
  int64 disk_read_bytes = 22;
  int64 disk_write_bytes = 23;
  // Network
  repeated NetworkInterface network_interfaces = 24;
  // Nginx
  int64 nginx_rss_bytes = 25;
  double error_rate_4xx = 26;
  double error_rate_5xx = 27;
  // Docker
  repeated ContainerStats container_stats = 28;
  string docker_version = 29;
  int32 containers_running = 30;
  int32 containers_stopped = 31;
  int32 containers_total = 32;
  repeated string local_ip_addresses = 33;
  repeated string public_ip_addresses = 34;
  // Physical GPU inventory and capability-aware telemetry. Metrics are only
  // meaningful when their name is present in GpuDevice.available_metrics.
  repeated GpuDevice gpu_devices = 35;
  // Availability lease state of a daemon advertising availability_lease_v1:
  // persisted acks, held leases and, for a voter, its acceptor view.
  AvailabilityLeaseReport availability_lease = 36;
  // Docker daemons advertising managed_link_runtime_v1: the connections of
  // every managed database and storage link this node serves workloads of.
  repeated ManagedLinkRuntime managed_links = 37;
  // Smoothed round-trip time from this node to each relay it measured
  // recently. Gateway places relay assignments by network distance with it.
  repeated RelayLatencySample relay_latencies = 40;
  // Daemons advertising relay_stream_resume_v1: their relay stream sessions.
  RelayStreamStats relay_streams = 41;
  // Docker and nginx daemons: the connections an update of this daemon keeps
  // and cuts now, and what its last update kept and cut.
  DaemonUpdateConnections update_connections = 42;
  // Nginx daemons: a problem of the host's nginx service that only root can
  // fix, as one sentence ending with the command that fixes it; empty when
  // there is none.
  string nginx_service_problem = 43;
  // Nginx daemons advertising ingress_group_v1: what the reserved endpoint
  // /.well-known/gateway-ingress-health answers (sf-ingress range 195-199).
  IngressHealthReport ingress_health = 195;
}

// Connections across an update of the daemon. A daemon advertising
// daemon_stream_handover_v1 hands its relay stream sessions (RSv1) and its
// node-local link connections to the next daemon process (live handover);
// what it cannot hand over is cut, as before.
message DaemonUpdateConnections {
  // An update now hands connections over: the running launcher keeps them.
  // False when an update now would restart the whole service for a newer
  // launcher (its connections are then under service_restart).
  bool handover_available = 1;
  // Live connections an update now would keep.
  uint32 kept = 2;
  // Live connections an update now would cut, by class (raw_stream,
  // postgres_tls, registry, backup, no_handover, service_restart, ...).
  map<string, uint32> cut = 3;
  // The last update of this daemon, once its counts are final.
  DaemonUpdateConnectionReport last_update = 4;
}

// What one update of the daemon did to the connections it carried.
message DaemonUpdateConnectionReport {
  string from_version = 1;
  string to_version = 2;
  // When the previous process began to stop.
  int64 started_at_unix_ms = 3;
  // When the counts became final (every handed over session resumed or ended).
  int64 finished_at_unix_ms = 4;
  // The update handed connections over (live handover).
  bool handover = 5;
  // Connections the previous process handed over.
  uint32 handed_over = 6;
  // Of those, the ones that carry on after the update.
  uint32 kept = 7;
  // Connections the update cut, by class (the classes of
  // DaemonUpdateConnections.cut, plus handshake, over_limit, resume_failed,
  // busy).
  map<string, uint32> cut = 8;
  // Pause of the handed over sessions, from the freeze to their resume.
  uint32 pause_p50_ms = 9;
  uint32 pause_p99_ms = 10;
  uint32 pause_max_ms = 11;
}

// Relay stream sessions of one daemon (RSv1). Totals count since the daemon
// started; gauges are the current values.
message RelayStreamStats {
  uint64 resumable_sessions = 1;
  uint64 legacy_sessions = 2;
  uint64 suspended_sessions = 3;
  uint64 migrations_ok_total = 4;
  uint64 migrations_failed_total = 5;
  // Resumable streams that ended abnormally (no relay, resume refused, timeout).
  uint64 cut_total = 6;
  uint64 retransmitted_bytes_total = 7;
  uint64 unacked_bytes = 8;
  uint32 migration_stall_p50_ms = 9;
  uint32 migration_stall_p95_ms = 10;
  repeated RelayStreamRelaySessions by_relay = 11;
  // Target side: resumes this daemon refused.
  uint64 resume_refused_total = 12;
  // Relay lane connections replaced because their TCP state collapsed or
  // learned a much shorter round trip (since the daemon started).
  uint64 lane_rotations_total = 13;
  // Resumable streams moved off a replaced lane connection (housekeeping,
  // not counted as migrations).
  uint64 lane_moves_total = 14;
}

message RelayStreamRelaySessions {
  string relay_instance_id = 1;
  uint64 resumable = 2;
  uint64 legacy = 3;
}

// The local answer of an nginx node's ingress health endpoint. Serving only
// while nginx runs the configuration of the daemon's last successful reload
// and, on a node that sources Secure Links, at least one relay transport is up.
message IngressHealthReport {
  bool serving = 1;
  // Empty while serving; otherwise why the endpoint answers 503.
  string reason = 2;
  // Config generation of the daemon's last successful reload.
  uint64 config_generation = 3;
  bool nginx_running = 4;
  // nginx serves config_generation (verified through the local probe).
  bool config_applied = 5;
  uint32 secure_link_sources = 6;
  uint32 usable_relay_transports = 7;
  int64 checked_at_unix_ms = 8;
}

// One managed link on the node that runs its workloads. The node is the
// link's single gate: its host listener (the storage connector socket for a
// storage link) holds the link at connection_limit, whichever relay of the
// pool carries a connection.
message ManagedLinkRuntime {
  // managed_database_binding or managed_storage_binding.
  string owner_kind = 1;
  // The binding id; an Availability placement id for a placement's link.
  string owner_id = 2;
  uint32 active_connections = 3;
  // The session limit Gateway signed into the link's grant.
  uint32 connection_limit = 4;
  // Connections this node refused since the daemon started because the link
  // or the node was at its limit. The relays count their own refusals.
  uint64 rejected_total = 5;
  // The reason of the latest refused connection, whatever refused it
  // (link_limit, node_limit, relay_capacity, source_not_allowed, ...).
  string last_rejection_reason = 6;
  int64 last_rejected_at_unix_ms = 7;
  // What the link carried through this node since the daemon started: the
  // sessions a relay opened for it and the bytes in each direction. The node
  // proxies every connection of the link, whichever relay carries it.
  uint64 opened_total = 8;
  uint64 source_to_target_bytes = 9;
  uint64 target_to_source_bytes = 10;
  // The sessions of opened_total that ended (an active session is not one).
  uint64 completed_total = 11;
}

message RelayLatencySample {
  string relay_instance_id = 1;
  // The smoothed round trip of the last successful measurements.
  uint32 rtt_micros = 2;
  // How long this daemon has failed to reach the relay (its lanes are down,
  // or its probes go unanswered), in milliseconds; 0 while it reaches it.
  // Gateway takes a relay whose control stream ended out of placement at
  // once when the daemons that measure it all fail to reach it.
  uint32 failing_ms = 3;
}

message StatsReport {
  int64 active_connections = 1;
  int64 accepts = 2;
  int64 handled = 3;
  int64 requests = 4;
  int32 reading = 5;
  int32 writing = 6;
  int32 waiting = 7;
  int64 timestamp = 8;
}

message DiskMount {
  string mount_point = 1;
  string filesystem = 2;
  string device = 3;
  int64 total_bytes = 4;
  int64 used_bytes = 5;
  int64 free_bytes = 6;
  double usage_percent = 7;
}

message NetworkInterface {
  string name = 1;
  int64 rx_bytes = 2;
  int64 tx_bytes = 3;
  int64 rx_packets = 4;
  int64 tx_packets = 5;
  int64 rx_errors = 6;
  int64 tx_errors = 7;
  repeated string ip_addresses = 8;
}

// Messages FROM Gateway TO daemon
message GatewayCommand {
  reserved 61, 67;
  string command_id = 1;
  // Optional absolute dispatch deadline in Unix milliseconds. Zero means no
  // deadline (older gateways). A daemon rejects a command that has already
  // expired when it is received instead of executing work the gateway no
  // longer waits for; older daemons ignore the field.
  int64 expires_at_unix_ms = 72;
  // Gateway wall clock in Unix milliseconds when the command was sent. Lets a
  // daemon judge expires_at_unix_ms against the gateway clock instead of its
  // own, so clock skew between the two does not expire commands. A daemon
  // skips the deadline check when this is zero; older daemons ignore it.
  int64 sent_at_unix_ms = 73;
  oneof payload {
    ApplyConfigCommand apply_config = 2;
    RemoveConfigCommand remove_config = 3;
    DeployCertCommand deploy_cert = 4;
    RemoveCertCommand remove_cert = 5;
    FullSyncCommand full_sync = 6;
    UpdateGlobalConfigCommand update_global_config = 7;
    DeployHtpasswdCommand deploy_htpasswd = 8;
    TestConfigCommand test_config = 9;
    RequestHealthCommand request_health = 10;
    RequestStatsCommand request_stats = 11;
    SetDaemonLogStreamCommand set_daemon_log_stream = 12;
    RemoveHtpasswdCommand remove_htpasswd = 13;
    DeployAcmeChallengeCommand deploy_acme_challenge = 14;
    RemoveAcmeChallengeCommand remove_acme_challenge = 15;
    ReadGlobalConfigCommand read_global_config = 16;
    RequestTrafficStatsCommand request_traffic_stats = 17;
    DockerContainerCommand docker_container = 18;
    DockerImageCommand docker_image = 19;
    DockerVolumeCommand docker_volume = 20;
    DockerNetworkCommand docker_network = 21;
    DockerExecCommand docker_exec = 22;
    DockerFileCommand docker_file = 23;
    DockerConfigPushCommand docker_config_push = 24;
    DockerLogsCommand docker_logs = 25;
    ExecInput exec_input = 26;
    NodeExecCommand node_exec = 27;
    UpdateDaemonCommand update_daemon = 28;
    DockerDeploymentCommand docker_deployment = 29;
    NodeFileCommand node_file = 30;
    DockerMigrationCommand docker_migration = 31;
    // Restricted managed database lifecycle; accepted only by docker-daemon
    // running with docker.mode = "databases".
    DockerDatabaseCommand docker_database = 32;
    // Restricted managed object-storage lifecycle. Accepted only by a
    // docker-daemon running with docker.mode = "storage".
    DockerStorageCommand docker_storage = 70;
    // Typed backup runner control. The storage profile delegates this to the
    // registered backup implementation and never exposes generic Docker exec.
    DockerBackupCommand docker_backup = 71;
    // Nginx TLS distribution v2. These commands are accepted only by a daemon
    // that reports nginx_certificate_distribution_v2 during registration.
    ApplyTlsBundleCommand apply_tls_bundle = 34;
    InspectCertificatesCommand inspect_certificates = 35;
    ExportLegacyCertificatesCommand export_legacy_certificates = 36;
    RemoveCertificateReplicaCommand remove_certificate_replica = 37;
    // Complete, revisioned set of opaque relay grants for this daemon.
    SyncRelayGrantsCommand sync_relay_grants = 38;
    // Full desired set of Proxy Host -> Docker secure-link bindings for this
    // daemon. Source bindings are accepted only by nginx-daemon; target
    // bindings are accepted only by a general docker-daemon.
    SyncProxySecureLinksCommand sync_proxy_secure_links = 39;
    // Execute the existing proxy health contract from nginx-daemon through
    // the loopback Secure Link listener.
    ProbeProxySecureLinkCommand probe_proxy_secure_link = 40;
    DockerRuntimeCommand docker_runtime = 41;
    // Gateway Pages v1. Nginx daemon accepts these only as its bounded Pages
    // runtime, which owns all paths below nginx.pages_root.
    PagesUploadInitCommand pages_upload_init = 42;
    PagesUploadChunkCommand pages_upload_chunk = 43;
    PagesUploadFinalizeCommand pages_upload_finalize = 44;
    PagesVerifyReleaseCommand pages_verify_release = 45;
    PagesMaterializePreviewCommand pages_materialize_preview = 46;
    PagesRemovePreviewCommand pages_remove_preview = 47;
    PagesActivateTagRouteCommand pages_activate_tag_route = 48;
    PagesDeactivateTagRouteCommand pages_deactivate_tag_route = 49;
    PagesCleanupDeploymentCommand pages_cleanup_deployment = 50;
    PagesInventoryCommand pages_inventory = 51;
    PagesStoragePreflightCommand pages_storage_preflight = 52;
    PagesDeployCertificateCommand pages_deploy_certificate = 53;
    // Gateway Pages runtime configuration v1. These commands only accept
    // opaque route IDs or validated preview hostnames; the daemon derives all
    // runtime-config paths below nginx.pages_root.
    PagesStageRuntimeConfigCommand pages_stage_runtime_config = 54;
    PagesActivateRuntimeConfigCommand pages_activate_runtime_config = 55;
    PagesRemoveRuntimeConfigCommand pages_remove_runtime_config = 56;
    // Capability-gated pre-activation reachability check for one staged relay
    // assignment candidate. The daemon returns its acknowledgement through the
    // existing CommandResult envelope.
    ProbeRelayCandidateCommand probe_relay_candidate = 57;
    SyncRelayPolicyCommand sync_relay_policy = 58;
    SetRelayDrainCommand set_relay_drain = 59;
    UpdateRelayWorkerCommand update_relay_worker = 60;
    // Accepted only by docker-daemon running with docker.mode = "builder".
    DockerBuildCommand docker_build = 62;
    DockerBuildCancelCommand docker_build_cancel = 63;
    SyncDockerRegistryBindingsCommand sync_docker_registry_bindings = 64;
    // First-class Docker Compose lifecycle. Accepted only by a general Docker
    // daemon advertising docker_compose_v1.
    DockerComposeCommand docker_compose = 65;
    // Probe one managed Pages Route through node-local nginx while preserving
    // its real Host header and TLS SNI. Accepted only by nginx-daemon.
    ProbePagesRouteCommand probe_pages_route = 66;
    // Confirms durable processing of one attempt-scoped Docker build terminal
    // event. Accepted only by docker-daemon running with docker.mode=builder.
    DockerBuildEventAck docker_build_event_ack = 68;
    // Generation-fenced placement lifecycle for Gateway-owned multi-node
    // Availability. Accepted only by a general Docker daemon advertising
    // docker_availability_v1; nodes never form a peer cluster.
    DockerAvailabilityCommand docker_availability = 69;
    // Relay supervisor only: installs a renewed relay data-plane server
    // certificate on its worker without dropping tunnels.
    RenewRelayIdentityCommand renew_relay_identity = 74;
    // Availability data-plane lease. Accepted by general docker-daemons and
    // nginx-daemons advertising availability_lease_v1. The sync carries the
    // signed voter config, manifests and policy key chain; the handoff asks
    // the current holder of one lease to release it to a designated successor.
    SyncAvailabilityLeaseCommand sync_availability_lease = 75;
    AvailabilityLeaseHandoffCommand availability_lease_handoff = 76;
    // Relay supervisor only (relay_route_runtime_v1): the runtime of relay
    // routes as its worker counts them.
    GetRelayRouteRuntimeCommand get_relay_route_runtime = 77;
  }
}

// A serialized relay.v1.ApplySnapshotRequest. Keeping the policy as opaque
// bytes makes the supervisor a transport/process boundary; the worker remains
// the only component that parses and authorizes signed relay policy.
message SyncRelayPolicyCommand {
  bytes apply_snapshot_request = 1;
  uint64 revision = 2;
  int64 expires_at_unix = 3;
}

message SetRelayDrainCommand {
  bool enabled = 1;
  bool force_disconnect = 2;
}

message UpdateRelayWorkerCommand {
  string download_url = 1;
  string target_version = 2;
  string checksum = 3;
  string signed_manifest = 4;
}

// A renewed relay server certificate. Its identity (the TLS server name) is
// new, so the worker can keep serving the certificate daemons still pin, by
// its own identity, until their grant bundles name the renewed one.
message RenewRelayIdentityCommand {
  bytes server_certificate = 1;
  bytes server_key = 2;
  string server_identity = 3;
  // SHA-256 fingerprint ("sha256:<hex>") of the certificate daemons pin now.
  string retain_server_fingerprint = 4;
}

// The supervisor asks its worker (RelayAdmin.GetRouteRuntime) for each route.
// CommandResult.detail carries JSON: {"runtimes": [relay.v1.RouteRuntimeResponse
// in protojson], "missing": [route ids the worker's policy does not hold]}. Any
// other failure fails the command, so a partial answer is never taken as whole.
message GetRelayRouteRuntimeCommand {
  repeated string route_ids = 1;
}

message RelayRuntimeStatus {
  string relay_instance_id = 1;
  string state = 2;
  string build_version = 3;
  uint32 protocol_major = 4;
  repeated string capabilities = 5;
  uint64 applied_policy_revision = 6;
  int64 policy_expires_at_unix = 7;
  uint64 registered_endpoints = 8;
  uint64 active_tunnels = 9;
  uint32 pressure_percent = 10;
  bool draining = 11;
  string error = 12;
  repeated string advertised_addresses = 13;
  uint32 service_port = 14;
  repeated RelayAssignmentTunnelCount assignment_tunnels = 15;
  repeated string policy_signing_key_ids = 16;
  // The relay's acceptor and data-path gate view (relays advertising
  // availability_lease_v1). member_id is the relay instance id.
  AvailabilityLeaseReport availability_lease = 17;
}

message RelayAssignmentTunnelCount {
  string endpoint_id = 1;
  uint64 assignment_generation = 2;
  uint64 active_tunnels = 3;
}

// Gateway Pages v1 commands intentionally expose no operator-controlled
// filesystem paths or nginx snippets. IDs are opaque UUIDs and hostnames are
// DNS names validated by the daemon. The daemon derives all locations from its
// configured Pages root and its nginx config directory.
message PagesUploadInitCommand {
  string upload_id = 1;
  string deployment_id = 2;
  int64 expected_size = 3;
  string sha256 = 4;
}

message PagesUploadChunkCommand {
  string upload_id = 1;
  int64 offset = 2;
  bytes content = 3;
}

message PagesUploadFinalizeCommand {
  string upload_id = 1;
  string deployment_id = 2;
}

message PagesVerifyReleaseCommand {
  string deployment_id = 1;
  string sha256 = 2;
}

// Creates or atomically updates the fixed immutable preview server for one
// stored deployment. profile_id is exactly the v1 singleton `default`.
// certificate_id and certificate_version are both empty for HTTP-only; when
// supplied, the config references that immutable certificate version directly.
message PagesMaterializePreviewCommand {
  string profile_id = 1;
  string deployment_id = 2;
  string hostname = 3;
  string certificate_id = 4;
  // Required together with certificate_id. Pages previews deliberately point
  // at an immutable version, so a failed config switch keeps serving the old
  // certificate instead of observing a changed current pointer on a later
  // unrelated reload.
  string certificate_version = 5;
  bool spa_fallback = 6;
  // Absolute HTTP(S) redirect used for missing paths when spa_fallback is false.
  string fallback_url = 7;
  // Optional Project access list, rendered like a proxy host's access list for
  // every location of the preview. Only sent to daemons advertising
  // nginx_pages_preview_access_v1; older daemons would ignore it and publish the
  // preview unprotected, so the control plane never materializes there.
  PagesPreviewAccess access = 8;
}

// IP allow/deny rules and optional basic authentication for a Pages preview.
// Basic-auth credentials are deployed separately with DeployHtpasswdCommand
// under the same access_list_id before the preview references them.
message PagesPreviewAccess {
  string access_list_id = 1;
  repeated PagesPreviewIpRule ip_rules = 2;
  bool basic_auth_enabled = 3;
}

message PagesPreviewIpRule {
  // "allow" or "deny".
  string type = 1;
  // IP address or CIDR.
  string value = 2;
}

// Stages and atomically activates a versioned certificate for a Pages-only
// preview. Gateway obtains version and replica_generation from its existing
// certificate distribution state. This must be used instead of deploy_cert,
// whose legacy layout has no current/versions tree.
message PagesDeployCertificateCommand {
  string cert_id = 1;
  bytes cert_pem = 2;
  bytes key_pem = 3;
  bytes chain_pem = 4;
  string version = 5;
  string replica_generation = 6;
}

message PagesRemovePreviewCommand {
  string hostname = 1;
}

// Writes an atomically switched root fragment that a normal Gateway Route
// includes from <nginx.config_dir>/pages/routes/<route_id>.inc. The fragment
// permits the Route to retain its existing TLS, ACL, headers, rewrites and
// other host-level settings while a Tag moves between immutable deployments.
// On success CommandResult.data is JSON with the daemon-derived includePath;
// Gateway validates its fixed /pages/routes/<route UUID>.inc suffix before
// placing it in a generated host config.
message PagesActivateTagRouteCommand {
  string route_id = 1;
  string deployment_id = 2;
}

message PagesDeactivateTagRouteCommand {
  string route_id = 1;
}

// Deletes a materialized release only after its daemon-owned preview and tag
// route fragments no longer reference it.
message PagesCleanupDeploymentCommand {
  string deployment_id = 1;
}

message PagesInventoryCommand {
  // Optional expected bindings for nginx_pages_reconcile_v1. The JSON result
  // contains positional matches; legacy inventory remains unchanged.
  bytes expectations_json = 1;
}

message PagesStoragePreflightCommand {
  int64 required_bytes = 1;
}

enum PagesRuntimeConfigBindingKind {
  PAGES_RUNTIME_CONFIG_BINDING_KIND_UNSPECIFIED = 0;
  PAGES_RUNTIME_CONFIG_BINDING_KIND_ROUTE = 1;
  PAGES_RUNTIME_CONFIG_BINDING_KIND_PREVIEW = 2;
}

// Stages one canonical JSON object as an immutable generation for a Route or
// Preview binding. The daemon validates the object and emits JavaScript itself;
// callers must never send JavaScript, paths, or nginx syntax.
message PagesStageRuntimeConfigCommand {
  PagesRuntimeConfigBindingKind binding_kind = 1;
  string binding_id = 2;
  uint64 generation = 3;
  bytes json = 4;
}

// Atomically switches a binding's stable current.js to an already staged
// generation. Activating an older generation is the rollback operation.
// CommandResult.data contains the daemon-derived stable configPath.
message PagesActivateRuntimeConfigCommand {
  PagesRuntimeConfigBindingKind binding_kind = 1;
  string binding_id = 2;
  uint64 generation = 3;
}

// Removes all staged generations and the stable current.js for the binding
// when generation is zero. A positive generation discards only that staged
// generation and refuses to remove it when current.js points at it.
message PagesRemoveRuntimeConfigCommand {
  PagesRuntimeConfigBindingKind binding_kind = 1;
  string binding_id = 2;
  uint64 generation = 3;
}

message SyncRelayGrantsCommand {
  uint64 policy_revision = 1;
  repeated RelayGrantAssignment grants = 2;
  // Monotonic creation time for grant refreshes within one policy revision.
  int64 generated_at_unix_ms = 3;
  uint32 data_lanes = 4;
  uint32 read_chunk_bytes = 5;
  // Relays that did not acknowledge a revoking policy in time, per endpoint
  // of this daemon. The endpoint refuses the listed routes through them.
  repeated RelayRevocationFence revocation_fences = 16;
  // Every relay of the pool, so the daemon measures its distance to relays
  // it holds no transport to yet. Measurement only: never a tunnel target.
  repeated RelayLatencyTarget relay_latency_targets = 20;
}

message RelayLatencyTarget {
  string relay_instance_id = 1;
  repeated string addresses = 2;
  uint32 port = 3;
}

// A relay that may still admit routes Gateway revoked for one endpoint. A
// relay that does not name the route of an incoming tunnel is refused
// entirely for this endpoint while the fence stands.
message RelayRevocationFence {
  string relay_instance_id = 1;
  string endpoint_id = 2;
  repeated RelayRevokedRoute routes = 3;
}

message RelayRevokedRoute {
  string route_id = 1;
  // The only generation the endpoint still accepts through the fenced relay;
  // 0 when the route no longer targets the endpoint.
  uint64 allowed_generation = 2;
}

message RelayGrantAssignment {
  string role = 1; // "endpoint" or "connect"
  string owner_kind = 2;
  string owner_id = 3;
  string endpoint_id = 4;
  string route_id = 5;
  string target_endpoint_id = 6;
  RelaySignedGrant grant = 7;
  repeated RelayDataCandidate candidates = 8;
  uint32 schema_version = 9;
  ManagedDatabaseListener managed_database_listener = 10;
  SecureLinkEgress secure_link_egress = 11;
  // Connect assignments only: streams of this route are resumable (RSv1,
  // capability relay_stream_resume_v1). Absent: streams are raw, as before.
  RelayStreamResume stream_resume = 12;
  // Endpoint assignments only: the routes to this endpoint whose streams may
  // be resumable, with their current and previous resume keys.
  repeated RelayRouteResume resume_routes = 13;
  // Database and storage availability sets (fields 213-219). Endpoint
  // assignments: the member and port the endpoint serves. Peer route
  // assignments: the member the route reaches.
  RelayLeaseTarget lease_target = 213;
  // Connect assignments of a set's resource: one route per member, each to
  // that member's endpoint. The daemon opens the route of the member that the
  // relay lease gate views name the holder first, then the others by rank
  // (the relay admits only the holder while the set's lease runs). This
  // assignment's own route fields are the group's first member, for daemons
  // that do not know groups.
  repeated RelayLeaseGroupRoute lease_group = 214;
}

// One member of a database or storage availability set as a relay path sees
// it.
message RelayLeaseTarget {
  string set_id = 1;
  string member_id = 2;
  // The member's lease identity (its node id): the holder id in gate views.
  string candidate_id = 3;
  // The set's current lease policy id (the relay gate key); empty for a
  // manual pair, whose primary is the only serving member.
  string lease_policy_id = 4;
  // Member order for the fallback when no gate view names a holder (0 first).
  uint32 rank = 5;
  // "managed_database" or "managed_storage", and the resource id.
  string owner_kind = 6;
  string owner_id = 7;
  // Member peer endpoints and routes: the engine port name ("pg-repl",
  // "kv-repl", "sw-master", "sw-volume", "sw-filer", "ch-interserver",
  // "ch-keeper"). Empty for client paths.
  string port_name = 8;
  // A port that reaches the primary only ("primary-<port>"); otherwise each
  // member is reached by its own alias ("member-<id>-<port>").
  bool primary_port = 9;
  // A route to a ClickHouse Keeper witness on a relay (relay-local endpoint):
  // the witness id; reached as "witness-<id>-<port>". member_id is empty.
  string witness_id = 10;
}

// One route of a lease group.
message RelayLeaseGroupRoute {
  string route_id = 1;
  string target_endpoint_id = 2;
  RelaySignedGrant grant = 3;
  repeated RelayDataCandidate candidates = 4;
  RelayStreamResume stream_resume = 5;
  RelayLeaseTarget target = 6;
  uint32 schema_version = 7;
}

// The source side of a resumable route (RSv1). The key never travels through
// a relay: it reaches the daemons only over their control sessions.
message RelayStreamResume {
  uint32 version = 1;  // 1
  string key_id = 2;   // 1..64 bytes, names the key to the target
  bytes key = 3;       // 32 bytes: HKDF-SHA256 route resume key
  // Proxy routes: a stream whose target -> source direction finished is reset
  // after this long without traffic (the relay's half-close reaping). 0: none.
  uint32 half_close_timeout_ms = 4;
}

// The target side of one resumable route (RSv1). The previous key stays valid
// while a rotation reaches the sources.
message RelayRouteResume {
  string route_id = 1;
  uint32 version = 2;  // 1
  string key_id = 3;
  bytes key = 4;
  string prev_key_id = 5;
  bytes prev_key = 6;
}

// Desired connector egress listener for a consumer-side link. Carried with the
// signed connect assignment so revocation also removes the local entry point.
message SecureLinkEgress {
  string network_name = 1;      // gateway-db-*, gateway-storage-*, gateway-link-*
  string alias = 2;             // DNS alias the connector gets on that network
  uint32 listen_port = 3;
  uint32 max_sessions = 4;      // 0 = unlimited
  string tls_ca_pem = 5;        // storage only: connector originates TLS
  string tls_server_name = 6;
  uint64 route_generation = 7;
  // The secure-link connector image, for a node that has egress but no proxy
  // secure-link target binding to take the image from.
  string connector_image = 8;
  // Database links: the binding's consumers are moved to the connector alias
  // (recreated without the ExtraHosts entry) while the host listener still
  // serves the ones not moved yet.
  bool consumers_use_alias = 9;
  // The connector joins the network and listens, but takes no DNS alias yet
  // (a storage cutover while the sidecar still holds it).
  bool alias_disabled = 10;
  // The connector's IPv4 address on the network (the address DNS-pinning
  // clients keep, taken over from a removed sidecar). Empty: the pool's
  // reserved address, else the address the connector already holds.
  string connector_address = 11;
}

// Desired daemon-side listener for a managed-database binding. It is carried
// with the signed relay assignment so grant revocation also removes its local
// TCP entry point.
message ManagedDatabaseListener {
  string network_name = 1;
  string listen_address = 2;
  uint32 listen_port = 3;
  repeated string allowed_sources = 4;
  uint64 route_generation = 5;
}

message RelaySignedGrant {
  string key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

message RelayDataCandidate {
  string pool_id = 1;
  string relay_instance_id = 2;
  uint64 assignment_generation = 3;
  repeated string addresses = 4;
  uint32 port = 5;
  string certificate_identity = 6;
  string certificate_fingerprint = 7;
  repeated string capabilities = 8;
  RelaySignedGrant grant = 9;
  string assignment_state = 10; // "active", "staging", or "draining"
  // Draining candidates: resumable streams leave this relay before this time
  // (unix ms), spread over the time left. 0: as soon as possible.
  int64 drain_deadline_unix_ms = 11;
  // Absent when Gateway placed the endpoint without latency data.
  RelayCandidateTopology topology = 20;
}

message RelayCandidateTopology {
  string role = 1; // "primary" or "standby"; standbys serve when no primary does
  // Last known round trip between this relay and the endpoint's node; 0 when unknown.
  uint32 endpoint_rtt_micros = 2;
}

message ProbeRelayCandidateCommand {
  string probe_id = 1;
  string role = 2; // "source" or "target"
  string endpoint_id = 3;
  string route_id = 4;
  uint64 assignment_generation = 5;
  RelayDataCandidate candidate = 6;
}

message SyncProxySecureLinksCommand {
  repeated ProxySecureLinkBinding bindings = 1;
}

message ProxySecureLinkBinding {
  string link_id = 1;
  string role = 2; // "source" or "target"
  uint64 generation = 3;

  // Source-only. Gateway allocates and persists this loopback port; the
  // nginx daemon validates and binds it before the generated config uses it.
  uint32 listener_port = 4;

  // Target-only. Docker daemon attaches the node connector to target_network
  // and exposes this exact destination through an allowlisted binding.
  string target_network = 5;
  string target_container = 6;
  string target_host = 7;
  uint32 target_port = 8;
  string connector_image = 9;
  // Container links may deterministically choose a replacement network after
  // recreate. Deployment router links must remain on their managed network.
  bool allow_network_reselection = 10;
  // Source-only. True only after the matching generated Nginx config has
  // completed cutover; restart recovery must never rewrite user-owned config.
  bool source_config_managed = 11;
  // Source-only. Allocate a new listener before retiring the currently live
  // one so an active target update remains fail-closed until Nginx cutover.
  bool rotate_listener = 12;
  // Source-only. Serve the managed Nginx upstream exclusively through its
  // authenticated Unix socket. False preserves the legacy loopback listener
  // for mixed-version recovery and user-owned legacy configs.
  bool socket_only = 13;
  // Availability members only. A dormant member belongs to a standby
  // placement (D7): the source keeps its socket closed and the target keeps
  // its connector prepared until the member's candidate holds the lease.
  // Older daemons ignore these fields; Gateway never sends a dormant member to
  // a daemon without availability_lease_v1.
  bool dormant = 14;
  // Availability members only: the lease policy and the candidate id (the
  // docker node id) whose lease opens this member (D8).
  string availability_policy_id = 15;
  string availability_candidate_id = 16;
  // Source-only. The loopback TCP endpoint ("127.a.b.c:port") the daemon
  // serves this link on next to its Unix socket, for nginx peers only. Unlike
  // a Unix socket, a cut stream ends with a TCP reset there, so nginx reports
  // an upstream error instead of a clean end. Gateway allocates it uniquely
  // per link and renders it only for nodes reporting
  // nginx_secure_link_loopback_tcp_v1. Empty: Unix socket only.
  string loopback_address = 17;
}

message ProbeProxySecureLinkCommand {
  string link_id = 1;
  string scheme = 2;
  string path = 3;
  int32 expected_status = 4;
  string expected_body = 5;
  string body_match_mode = 6;
  int32 timeout_seconds = 7;
}

message ProbePagesRouteCommand {
  string route_id = 1;
  string domain = 2;
