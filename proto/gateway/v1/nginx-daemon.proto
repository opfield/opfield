  string body_match_mode = 7;
  int32 timeout_seconds = 8;
}

message NodeExecCommand {
  string action = 1;          // "create", "resize"
  repeated string command = 2; // shell override (default: auto-detect)
  bool tty = 3;
  int32 rows = 4;
  int32 cols = 5;
  string session_key = 6;     // authenticated Gateway user ID
}

message NodeFileCommand {
  string action = 1;
  string path = 2;
  int64 max_bytes = 3;
