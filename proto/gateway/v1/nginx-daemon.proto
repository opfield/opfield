  string host_id = 1;
  string config_content = 2;
  string config_ownership = 3;
  ProxyMaintenanceFlag maintenance = 4; // as in ApplyConfigCommand
}

message CertBundle {
  string cert_id = 1;
  bytes cert_pem = 2;
  bytes key_pem = 3;
  bytes chain_pem = 4;
}

message HtpasswdFile {
  string access_list_id = 1;
  string content = 2;
}

message UpdateGlobalConfigCommand {
  string content = 1;
  string backup_content = 2;
}

message DeployHtpasswdCommand {
