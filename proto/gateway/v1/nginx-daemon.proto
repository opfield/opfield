// ---------------------------------------------------------------------------
// Availability data-plane lease (Docker Availability failover without Gateway).
// Blocks are opaque serialized relay.v1 messages, like SyncRelayPolicyCommand:
// they are signed by the relay policy signing key and verified by the daemon's
// availabilitylease package, never trusted because of this transport alone.
// ---------------------------------------------------------------------------

message SyncAvailabilityLeaseCommand {
  // Monotonic distribution revision. The daemon reports the last revision it
  // applied in AvailabilityLeaseReport.lease_revision.
  uint64 revision = 1;
  // This daemon's voter/candidate id in the blocks (its node id).
  string member_id = 2;
  // Policy signing keys delivered over this authenticated stream (A4). The
  // daemon trusts them directly; rotation links extend trust to later keys.
  repeated AvailabilityLeasePolicyKey policy_keys = 3;
  // Serialized relay.v1.LeasePolicyKeyRotation links, oldest first (A14).
  repeated bytes key_rotations = 4;
  // Unused since voters travel in each policy manifest (A18); always empty.
  bytes voter_config = 5;
  // Serialized relay.v1.LeaseSignedBlock of kind MANIFEST, one per policy in
  // bootstrapping, lease or closing mode. The set is complete: a policy that is
  // absent went back to legacy after its lease-closed manifest was acked.
  repeated bytes manifests = 6;
}

message AvailabilityLeasePolicyKey {
  string key_id = 1;
  // Raw 32-byte Ed25519 public key.
  bytes public_key = 2;
  // "sha256:<hex>" of public_key.
  string public_key_fingerprint = 3;
}

// Planned handoff (D9, A6): the current holder of (policy_id, slot) checks
// that the successor is ready, stops its workload, deregisters its endpoint
// and releases the lease to successor_id. Acceptors accept only that successor
// for the successor window, then open the key to anyone.
message AvailabilityLeaseHandoffCommand {
  string policy_id = 1;
  uint32 slot = 2;
  // Candidate id (docker node id) of the successor.
  string successor_id = 3;
  string operation_id = 4;
  // Placement generation the successor serves under (D12).
  uint64 successor_generation = 5;
  // Manifest version the Gateway planned against; a holder with an older
  // manifest refuses the handoff until it adopted this version.
  uint64 manifest_version = 6;
}

message AvailabilityLeaseBallot {
  uint64 round = 1;
  uint64 incarnation = 2;
  string proposer_id = 3;
}

message AvailabilityLeaseReport {
  // Voter/candidate id: node id for daemons, relay instance id for relays.
  string member_id = 1;
  // PKIX DER ECDSA P-256 public key of the identity that signs frames.
  bytes identity_public_key = 2;
  // Persisted incarnation, bumped on every start (A3).
  uint64 incarnation = 3;
  // Highest voter config epoch persisted (A4 persisted ack).
  uint64 epoch = 4;
  // Policy signing keys this member trusts, directly or through rotation
  // links (A14 ack).
  repeated string trusted_policy_key_ids = 5;
  // Manifest versions persisted per policy (A4, A5 lease-closed ack).
  repeated AvailabilityLeaseManifestAck manifests = 6;
  // Daemons only: leases this node proposes for, with its local role.
  repeated AvailabilityLeaseHeld held = 7;
  // Voters (and relays, which also keep shadow accepts): acceptor view.
  repeated AvailabilityLeaseKeyView acceptor = 8;
  // True while the acceptor abstains after a start or a fresh state (A3).
  bool acceptor_abstaining = 9;
  // Docker daemons: the watchdog heartbeat is fresh (A12.4). A daemon without
  // it must not acquire, so Gateway treats it as not capable.
  bool watchdog_ready = 10;
  // Transitions since the previous report, oldest first (D9 audit).
  repeated AvailabilityLeaseEvent events = 11;
  // Last SyncAvailabilityLeaseCommand revision applied.
  uint64 lease_revision = 12;
  // Relays only, as in relay.v1 (the relay supervisor forwards the relay's
  // report as is): members with a live Coordinate stream to this relay. The
  // Gateway derives voter reachability from them.
  repeated string connected_member_ids = 21;
  // Docker daemons: the daemon's wall clock (Unix ms) when it built this
  // report, the clock every *_unix_ms time in it was converted with. Gateway
  // measures the daemon's clock offset from it and corrects those times (a VM
  // resumed from suspend runs minutes behind until NTP steps it; N-15).
  // gateway.v1 only; 30 is unused in relay.v1, whose reports are forwarded as is.
  int64 reported_at_unix_ms = 30;
}

message AvailabilityLeaseManifestAck {
  string policy_id = 1;
  uint64 manifest_version = 2;
  bool closed = 3;
  // Per-policy voter epoch persisted with the manifest (A18; Node.Epoch(policy)).
  // The A4 ack the Gateway waits for before it settles a joint voter change.
  // Relays fill it; daemons should too. Zero means unknown: the Gateway then
  // falls back to manifest_version.
  uint64 voter_epoch = 20;
  // This member is in a quorum set of the policy (relays: it is the witness).
  bool voter = 21;
  // This member is listed in the policy's manifest members.
  bool member = 22;
}

message AvailabilityLeaseHeld {
  string policy_id = 1;
  uint32 slot = 2;
  // availabilitylease.Role: candidate, acquiring, bootstrapping, recovering,
  // holding, fencing, abandoned, releasing or retained.
  string role = 3;
  // Ballot of the last committed round, when any.
  AvailabilityLeaseBallot ballot = 4;
  // Epoch and manifest version of the last committed round (A4 settlement).
  uint64 epoch = 5;
  uint64 manifest_version = 6;
  string placement_id = 7;
  uint64 placement_generation = 8;
  // Graceful close: this node kept its copy of the slot running after the
  // lease closed; a majority of every quorum set of the closed manifest
  // confirmed it (ballot = its last committed ballot). Its watchdog deadline
  // is disarmed and the copy is no longer lease-bound: adopt it as running.
  bool retained = 9;
  // Docker daemons: when this node acquired the key for its current holding
  // (its own acquired transition), Unix ms on its wall clock; 0 when unknown.
  // Gateway audits it as the takeover time (N-5, B-14). gateway.v1 only:
  // relays report no held keys.
  int64 held_since_unix_ms = 10;
}

message AvailabilityLeaseKeyView {
  string policy_id = 1;
  uint32 slot = 2;
  // relay.v1.LeaseKeyState name without prefix: free, held, reserved,
  // abstaining or closed.
  string state = 3;
  string holder_id = 4;
  string reserved_for = 5;
  AvailabilityLeaseBallot promised = 6;
  AvailabilityLeaseBallot committed = 7;
  uint64 epoch = 8;
  uint64 manifest_version = 9;
  // Relays only: the data-path gate for the holder is open (A11).
  bool gate_open = 10;
  // Relays only, as in relay.v1: the holder and committed ballot the gate
  // admits. An open gate names a fresh holder even where the relay does not
  // vote, so the Gateway records it as a holder observation.
  string gate_holder_id = 20;
  AvailabilityLeaseBallot gate_ballot = 21;
  // As in relay.v1 (same field number): when this member first stored a
  // commit of the committed ballot's proposer, Unix ms of its wall clock;
  // zero when unknown.
  int64 holder_since_unix_ms = 25;
  // As in relay.v1 (same field numbers), stateful keys only
  // (availability_lease_v3): whether this acceptor's memory of the key is
  // KNOWN, the ballot it last accepted, "sha256:<hex>" of that state and of
  // the latest commit's state. The state bytes are never reported.
  bool stateful = 26;
  bool state_known = 27;
  string state_hash = 28;
  AvailabilityLeaseBallot accepted = 29;
  string committed_state_hash = 30;
}

message AvailabilityLeaseEvent {
  // acquired, fence, released or handoff (availabilitylease.EventKind), or
  // recovered: a key renewed by a copy that kept running through a daemon
  // restart, the same holding and not a new acquisition.
  string kind = 1;
  string policy_id = 2;
  uint32 slot = 3;
  AvailabilityLeaseBallot ballot = 4;
  string successor_id = 5;
  string reason = 6;
  int64 at_unix_ms = 7;
}

message DockerRuntimeCommand {
  string action = 1; // "preflight" or "install"
  string runtime = 2; // currently "runsc"
}

message DockerRuntimeStatus {
  string state = 1; // healthy, installable, unsupported, unknown, installing, failed
  string installed_version = 2;
  string target_version = 3;
  string reason_code = 4;
  string message = 5;
  int64 checked_at_unix_ms = 6;
  bool remote_installable = 7;
  string local_install_command = 8;
  string step = 9; // preparing, downloading, verifying_download, installing_binaries, configuring_docker, restarting_docker, verifying_runtime
  uint32 progress_percent = 10; // meaningful while step is "downloading"
}

message DockerBuildCommand {
  string build_id = 1;
  string repository_url = 2;
  string repository_remote_id = 3;
  string repository_full_path = 4;
  string ref = 5;
  string commit_sha = 6;
  string dockerfile_path = 7;
  string context_path = 8;
  string platform = 9;
  string output_repository = 10;
  string output_tag = 11;
  map<string, string> build_args = 12;
  map<string, bytes> build_secrets = 13;
  bytes checkout_credential = 14;
  repeated string allowed_dependencies = 15;
  int64 cpu_limit_millis = 16;
  int64 memory_limit_bytes = 17;
  int64 disk_limit_bytes = 18;
  int32 timeout_seconds = 19;
  string output_kind = 20; // oci_image or pages_archive
  string application_root = 21;
  string package_manager = 22;
  string package_manager_version = 23;
  string node_version = 24;
  string build_script = 25;
  string artifact_directory = 26;
  int32 worker_parallelism = 27;
  // Attempt number echoed by worker events. Zero preserves compatibility with
  // peers that predate terminal-event acknowledgements.
  uint32 attempt = 28;
  // Explicit opt-out; false preserves scanning for existing senders.
  bool skip_vulnerability_scan = 29;
}

message DockerBuildCancelCommand {
  string build_id = 1;
  string reason = 2;
}

message DockerBuildEvent {
  string build_id = 1;
  string status = 2;
  uint64 sequence = 3;
  bytes log_chunk = 4;
  string progress_json = 5;
  string artifact_repository = 6;
  string artifact_digest = 7;
  int64 artifact_size_bytes = 8;
  string platform = 9;
  string sbom_digest = 10;
  string provenance_digest = 11;
  string scan_summary_json = 12;
  string policy_decision = 13;
  string error_code = 14;
  string error_message = 15;
  int64 occurred_at_unix_ms = 16;
  uint32 attempt = 17;
}

message DockerBuildEventAck {
  string build_id = 1;
  uint32 attempt = 2;
  string disposition = 3; // accepted or obsolete
}

message SyncDockerRegistryBindingsCommand {
  repeated DockerRegistryBinding bindings = 1;
}

message DockerRegistryBinding {
  string binding_id = 1;
  string role = 2; // builder, runtime, or ingress
  uint64 generation = 3;
  string repository = 4;
  repeated string actions = 5; // pull and/or push
  string local_address = 6;
  uint32 local_port = 7;
  string relay_owner_kind = 8;
  string relay_owner_id = 9;
  string authorization = 10;
  int64 authorization_expires_at_unix = 11;
}

message DockerExecCommand {
  string action = 1;
  string container_id = 2;
  repeated string command = 3;
  bool tty = 4;
  bool stdin = 5;
  int32 rows = 6;
  int32 cols = 7;
  string user = 8;
  string session_key = 9;     // authenticated Gateway user ID
}

message DockerFileCommand {
  string action = 1;
  string container_id = 2;
  string path = 3;
  int64 max_bytes = 4;
  bytes content = 5;
  string target_path = 6;
}

message DockerConfigPushCommand {
  repeated RegistryConfig registries = 1;
  repeated string allowlist = 2;
}

message RegistryConfig {
  string url = 1;
  string username = 2;
  string password = 3;
}

message DockerLogsCommand {
  string container_id = 1;
  int32 tail_lines = 2;
  bool follow = 3;
  bool timestamps = 4;
  string since = 5;    // RFC3339 timestamp
  string until = 6;    // RFC3339 timestamp
}

message ExecInput {
  string exec_id = 1;
  bytes data = 2;
}

message ExecOutput {
  string exec_id = 1;
  bytes data = 2;
  bool exited = 3;
  int32 exit_code = 4;
}

message ContainerStats {
  string container_id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  double cpu_percent = 5;
  int64 memory_usage_bytes = 6;
  int64 memory_limit_bytes = 7;
  int64 network_rx_bytes = 8;
  int64 network_tx_bytes = 9;
  int64 block_read_bytes = 10;
  int64 block_write_bytes = 11;
  int64 pids = 12;
  // Bytes in the container's log files on the node, rotated files included.
  int64 log_bytes = 13;
  // False when log_bytes is unknown: the container is not running, its log
  // driver keeps no readable files, or the daemon may not read them.
  bool log_bytes_available = 14;
}

// A node-scoped physical GPU. `id` is stable for the lifetime of the device
// on this node and is the only identifier accepted by Gateway GPU attachment
// requests. Host paths are informational only and never executable input.
message GpuDevice {
  string id = 1;
  string vendor = 2; // "nvidia", "amd", or "intel"
  string model = 3;
  string pci_address = 4;
  string render_node = 5;
  int32 device_index = 6;
  bool attachable = 7;
  string unavailable_reason = 8;
  bool partitioned = 9;

  double utilization_percent = 10;
  int64 memory_total_bytes = 11;
  int64 memory_used_bytes = 12;
  double temperature_celsius = 13;
  double power_watts = 14;
  double power_limit_watts = 15;
  bool throttled = 16;
  int64 ecc_corrected_errors = 17;
  int64 ecc_uncorrected_errors = 18;
  string health = 19;
  repeated string available_metrics = 20;
}

// ─── Log Streaming ──────────────────────────────────────────────────

service LogStream {
  // Daemon streams log entries to Gateway
  rpc StreamLogs(stream LogStreamMessage) returns (stream LogStreamControl);
}

message LogStreamMessage {
  oneof payload {
    LogSubscribeAck subscribe_ack = 1;
    LogEntry entry = 2;
  }
}

message LogSubscribeAck {
  string host_id = 1;
}

message LogEntry {
  string host_id = 1;
  string timestamp = 2;
  string remote_addr = 3;
  string method = 4;
  string path = 5;
  int32 status = 6;
  int64 body_bytes_sent = 7;
  string referer = 8;
  string user_agent = 9;
  string upstream_response_time = 10;
  string raw = 11;
  string log_type = 12; // "access" or "error"
  string level = 13;    // for error logs: "error", "warn", "crit", etc.
}

message LogStreamControl {
  oneof payload {
    LogSubscribe subscribe = 1;
    LogUnsubscribe unsubscribe = 2;
  }
}

message LogSubscribe {
  string host_id = 1;
  int32 tail_lines = 2;
}

message LogUnsubscribe {
  string host_id = 1;
}

message UpdateDaemonCommand {
  string download_url = 1;
  string target_version = 2;
  string checksum = 3;        // sha256 of the binary
  string signed_manifest = 4; // signed update manifest envelope
}

// Small migration control operations. Artifact bytes are carried exclusively
// by MigrationTransfer.Transfer.
message DockerMigrationCommand {
  string action = 1;
  string migration_id = 2;
  string artifact_id = 3;
  string artifact_type = 4;
  string resource_id = 5;
  string config_json = 6;
}

// Database control intentionally carries a typed managed database id, rather
// than allowing the Gateway to issue arbitrary container commands to a
// database node. The opaque config is validated by the database profile.
message DockerDatabaseCommand {
  string action = 1; // create, start, stop, update, remove, inspect
  string managed_database_id = 2;
  string config_json = 3;
}

// Managed object-storage control intentionally names a Gateway-owned storage
// resource. The daemon validates the opaque config against its MinIO runtime
// contract and derives all Docker paths, names and arguments itself.
message DockerStorageCommand {
  string action = 1;
  string managed_storage_id = 2;
  string config_json = 3;
}

// Node-executed backup control. The run id is immutable and lets the runner
// return durable status after a control-channel reconnect.
message DockerBackupCommand {
  string action = 1; // preflight, start, status, cancel
  string run_id = 2;
  string config_json = 3;
}

message MigrationTransferMessage {
  oneof payload {
    MigrationTransferHello hello = 1;
    MigrationArtifactChunk chunk = 2;
    MigrationArtifactAck ack = 3;
    MigrationArtifactError error = 4;
  }
}

message MigrationTransferControl {
  oneof payload {
    MigrationArtifactRead read = 1;
    MigrationArtifactWrite write = 2;
    MigrationArtifactChunk chunk = 3;
    MigrationArtifactAck ack = 4;
    MigrationArtifactError error = 5;
    MigrationHeartbeat heartbeat = 6;
  }
}

message MigrationTransferHello {
  string node_id = 1;
  string capability = 2;
  int32 max_chunk_bytes = 3;
}

message MigrationArtifactRead {
  string migration_id = 1;
  string artifact_id = 2;
  int64 offset = 3;
}

message MigrationArtifactWrite {
  string migration_id = 1;
  string artifact_id = 2;
  int64 offset = 3;
}

message MigrationArtifactChunk {
  string migration_id = 1;
  string artifact_id = 2;
  int64 offset = 3;
  bytes data = 4;
  bool eof = 5;
}

message MigrationArtifactAck {
  string migration_id = 1;
  string artifact_id = 2;
  int64 acknowledged_offset = 3;
  bool complete = 4;
}

message MigrationArtifactError {
  string migration_id = 1;
  string artifact_id = 2;
  string message = 3;
}

message MigrationHeartbeat {
  string migration_id = 1;
}
