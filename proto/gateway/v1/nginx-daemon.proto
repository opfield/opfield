  string target_path = 5;
}

message ApplyConfigCommand {
  string host_id = 1;
  string config_content = 2;
  bool test_only = 3;
  string config_ownership = 4; // "managed_secure_link", "user_owned", or empty to preserve
  // The config is written and tested, and loaded with the reload of the batch it belongs to (reconnect resync):
  // the next command that reloads nginx, or the daemon itself shortly after the last deferred change. Content
  // equal to the file on disk is never rewritten or reloaded.
  bool defer_reload = 5;
  // The route's maintenance flag (ignored for test_only). See ProxyMaintenanceFlag.
  ProxyMaintenanceFlag maintenance = 6;
}

// Maintenance of a route on a daemon that reports proxy_maintenance_flag_v1. Its config carries a guard that answers
// with the maintenance page only while the daemon keeps the route's flag file, so maintenance starts and ends without
// an nginx reload. UNSPECIFIED (older gateways, certificate renewals) leaves the flag as it is.
enum ProxyMaintenanceFlag {
  PROXY_MAINTENANCE_FLAG_UNSPECIFIED = 0;
  PROXY_MAINTENANCE_FLAG_OFF = 1;
  PROXY_MAINTENANCE_FLAG_ON = 2;
}

// Daemon also cleans up associated cache directory and maintenance flag on removal
message RemoveConfigCommand {
  string host_id = 1;
}

// Cert deployment does NOT auto-reload nginx. Gateway sends a separate
// ApplyConfigCommand or TestConfigCommand + reload when ready.
message DeployCertCommand {
  string cert_id = 1;
  bytes cert_pem = 2;
  bytes key_pem = 3;
  bytes chain_pem = 4;
}

// Atomically stages each certificate version, switches current pointers,
// writes one host config, validates nginx, and reloads. On failure the daemon
// restores both the previous config and previous certificate pointers.
message ApplyTlsBundleCommand {
  string host_id = 1;
  string config_content = 2;
  repeated VersionedCertBundle certificates = 3;
  string generation = 4;
  string config_ownership = 5;
  bool defer_reload = 6; // as in ApplyConfigCommand
  ProxyMaintenanceFlag maintenance = 7; // as in ApplyConfigCommand
}

message VersionedCertBundle {
  string cert_id = 1;
  bytes cert_pem = 2;
  bytes key_pem = 3;
  bytes chain_pem = 4;
  string version = 5;
  string replica_generation = 6;
}

// Both inspection and export are scoped to references explicitly supplied by
// Gateway; neither command is a directory listing or generic file API.
message InspectCertificatesCommand {
