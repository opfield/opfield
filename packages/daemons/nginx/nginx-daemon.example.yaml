# nginx-daemon configuration
# Copy this file to /etc/nginx-daemon/config.yaml and adjust values.

opfield:
  address: "opfield.example.com:9443"
  token: ""  # Only needed for initial enrollment
  cert_sha256: "sha256:<opfield-grpc-leaf-fingerprint>"

tls:
  ca_cert: "/etc/nginx-daemon/certs/ca.pem"
  client_cert: "/etc/nginx-daemon/certs/node.pem"
  client_key: "/etc/nginx-daemon/certs/node-key.pem"

nginx:
  config_dir: "/etc/nginx/opfield/conf.d"
  certs_dir: "/etc/nginx/certs"
  logs_dir: "/var/log/nginx"
  global_config: "/etc/nginx/nginx.conf"
  binary: "/usr/sbin/nginx"
  stub_status_url: "http://127.0.0.1/nginx_status"
  htpasswd_dir: "/etc/nginx/opfield/htpasswd"
  acme_challenge_dir: "/var/www/acme-challenge"
  # Managed Pages releases, upload sessions, and generated fixed preview
  # configurations. This directory is daemon-owned persistent state.
  pages_root: "/var/lib/nginx-daemon/pages"

console:
  enabled: true  # host console; false turns it off (Opfield cannot turn it back on)
  user: ""  # OS user for host console sessions; empty = daemon's user

files:
  enabled: true  # host file access; false turns it off (Opfield cannot turn it back on)

state_dir: "/var/lib/nginx-daemon"
log_level: "info"   # debug, info, warn, error
log_format: "json"  # json, text
