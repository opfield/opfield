# Shared Compose policy parity fixtures.
#
# The docker daemon (compose_test.go) and the backend Compose policy in the
# commercial core (backend/docker/compose/compose-policy.test.ts) both run every
# case, so a document the backend accepts is never rejected at apply by the
# daemon, and the daemon never accepts a document the backend rejects. Every
# case runs with project name "example" and without variables.
#
# backendCode/backendMessage: a diagnostic code and message fragment the backend
# must report. daemonError: a fragment of the daemon validation error.
cases:
  - name: short-syntax named volumes
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - data:/data
            - data:/cache:ro
            - data:/state:rw
      volumes:
        data: {}

  - name: long-syntax named volume with type
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - type: volume
              source: data
              target: /data
              read_only: true
      volumes:
        data: {}

  - name: long-syntax volume without type
    valid: false
    backendCode: VOLUME_TYPE_REQUIRED
    backendMessage: Volume entry 1 of service web uses long syntax without type
    daemonError: compose service "web" volume 1 uses long syntax without type
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - data:/cache
            - source: data
              target: /data
      volumes:
        data: {}

  - name: long-syntax bind mount
    valid: false
    backendCode: HOST_BIND_FORBIDDEN
    daemonError: host bind mounts
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - type: bind
              source: /etc
              target: /data

  - name: long-syntax volume without target
    valid: false
    backendCode: INVALID_VOLUME
    daemonError: absolute container path
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - type: volume
              source: data
      volumes:
        data: {}

  - name: long-syntax volume with relative target
    valid: false
    backendCode: INVALID_VOLUME
    daemonError: absolute container path
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - type: volume
              source: data
              target: data
      volumes:
        data: {}

  - name: long-syntax volume options
    valid: false
    backendCode: UNSUPPORTED_VOLUME_FIELD
    daemonError: volume feature "volume" is not supported
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - type: volume
              source: data
              target: /data
              volume:
                nocopy: true
      volumes:
        data: {}

  - name: long-syntax volume with non-boolean read_only
    valid: false
    backendCode: INVALID_VOLUME
    daemonError: read_only must be a boolean
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - type: volume
              source: data
              target: /data
              read_only: "yes"
      volumes:
        data: {}

  - name: short-syntax volume with empty mode
    valid: false
    backendCode: INVALID_VOLUME
    daemonError: mode must be ro or rw
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - "data:/data:"
      volumes:
        data: {}

  - name: short-syntax volume with unsupported mode
    valid: false
    backendCode: INVALID_VOLUME
    daemonError: mode must be ro or rw
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - data:/data:z
      volumes:
        data: {}

  - name: short-syntax volume without target
    valid: false
    backendCode: ANONYMOUS_VOLUME
    daemonError: unnamed volumes are not supported
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - data
      volumes:
        data: {}

  - name: short-syntax undeclared volume
    valid: false
    backendCode: UNDECLARED_VOLUME
    daemonError: undeclared named volume "cache"
    yaml: |
      services:
        web:
          image: nginx:alpine
          volumes:
            - cache:/cache
      volumes:
        data: {}

  - name: implicit default network
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [default]

  - name: default network next to a declared network with aliases
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks:
            default:
            app:
              aliases: [api]
      networks:
        app: {}

  - name: service network settings beyond aliases
    valid: false
    backendCode: UNSUPPORTED_NETWORK
    daemonError: only supports aliases
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks:
            app:
              ipv4_address: 172.30.0.10
      networks:
        app: {}

  - name: undeclared service network
    valid: false
    backendCode: UNDECLARED_NETWORK
    daemonError: network "missing" is not declared
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [missing]

  - name: external network named host
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "host"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [outside]
      networks:
        outside:
          external: true
          name: host

  - name: external network none by its key
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "none"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [none]
      networks:
        none:
          external: true

  - name: external Secure Links management network
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "gateway-secure-links"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [links]
      networks:
        links:
          external: true
          name: gateway-secure-links

  - name: external managed database network under a user key
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "gateway-db-0123456789abcdef"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [db]
      networks:
        db:
          external: true
          name: gateway-db-0123456789abcdef

  - name: project network named like a managed storage network
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "gateway-storage-0123456789abcdef"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [storage]
      networks:
        storage:
          name: gateway-storage-0123456789abcdef

  - name: managed database link network added by Opfield
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks:
            gateway_db_0123456789abcdef:
      networks:
        gateway_db_0123456789abcdef:
          external: true
          name: gateway-db-0123456789abcdef

  - name: managed database link key naming another reserved network
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "gateway-secure-links"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [gateway_db_0123456789abcdef]
      networks:
        gateway_db_0123456789abcdef:
          external: true
          name: gateway-secure-links

  - name: external Opfield Secure Links management network
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "opfield-secure-links"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [links]
      networks:
        links:
          external: true
          name: opfield-secure-links

  - name: external Opfield managed database network under a user key
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "opfield-db-0123456789abcdef"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [db]
      networks:
        db:
          external: true
          name: opfield-db-0123456789abcdef

  - name: project network named like an Opfield container link network
    valid: false
    backendCode: RESERVED_NETWORK
    daemonError: uses reserved network name "opfield-link-0123456789abcdef"
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [shared]
      networks:
        shared:
          name: opfield-link-0123456789abcdef

  - name: managed database link network of a link created from 2.12.1 on
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks:
            opfield_db_0123456789abcdef:
      networks:
        opfield_db_0123456789abcdef:
          external: true
          name: opfield-db-0123456789abcdef

  - name: network name from a variable
    valid: false
    backendCode: INVALID_RESOURCE_NAME
    daemonError: name must not use variables
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [shared]
      networks:
        shared:
          external: true
          name: ${SHARED_NETWORK:-proxy}

  - name: external and project networks with ordinary names
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [proxy, backend]
      networks:
        proxy:
          external: true
          name: edge-proxy
        backend:
          name: example-backend

  - name: service label gateway.sandbox
    valid: false
    backendCode: RESERVED_LABEL
    daemonError: compose label "gateway.sandbox" is reserved
    yaml: |
      services:
        web:
          image: nginx:alpine
          labels:
            gateway.sandbox: "true"

  - name: service label in the wiolett.gateway. namespace
    valid: false
    backendCode: RESERVED_LABEL
    daemonError: compose label "wiolett.gateway.deployment.id" is reserved
    yaml: |
      services:
        web:
          image: nginx:alpine
          labels:
            wiolett.gateway.deployment.id: 00000000-0000-4000-8000-000000000000

  - name: service label in the net.opfield. namespace
    valid: false
    backendCode: RESERVED_LABEL
    daemonError: compose label "net.opfield.deployment.id" is reserved
    yaml: |
      services:
        web:
          image: nginx:alpine
          labels:
            net.opfield.deployment.id: 00000000-0000-4000-8000-000000000000

  - name: service label in the net.wiolett.gateway. namespace
    valid: false
    backendCode: RESERVED_LABEL
    daemonError: compose label "net.wiolett.gateway.managed" is reserved
    yaml: |
      services:
        web:
          image: nginx:alpine
          labels:
            - net.wiolett.gateway.managed=true

  - name: service label in the com.wiolett.gateway. namespace
    valid: false
    backendCode: RESERVED_LABEL
    daemonError: compose label "com.wiolett.gateway.managed-service" is reserved
    yaml: |
      services:
        web:
          image: nginx:alpine
          labels:
            com.wiolett.gateway.managed-service: database

  - name: network label in the wiolett.gateway. namespace
    valid: false
    backendCode: RESERVED_LABEL
    daemonError: compose label "wiolett.gateway.internal-workload" is reserved
    yaml: |
      services:
        web:
          image: nginx:alpine
          networks: [app]
      networks:
        app:
          labels:
            wiolett.gateway.internal-workload: managed-storage-connector

  - name: label key from a variable
    valid: false
    backendCode: RESERVED_LABEL
    daemonError: cannot use variables in its key
    yaml: |
      services:
        web:
          image: nginx:alpine
          labels:
            - ${LABEL_KEY:-gateway.sandbox}=true

  - name: labels next to the reserved namespaces
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          labels:
            gateway.sandboxed: "true"
            wiolett.gateway: owner
            org.example.opfield.note: kept
            net.opfield: owner
            org.example.net.opfield.note: kept

  - name: depends_on list and long syntax with condition
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          depends_on:
            db:
              condition: service_healthy
        worker:
          image: nginx:alpine
          depends_on: [db]
        db:
          image: postgres:16-alpine

  - name: long-syntax depends_on without condition
    valid: false
    backendCode: DEPENDS_ON_CONDITION_REQUIRED
    daemonError: depends_on "db" requires condition
    yaml: |
      services:
        web:
          image: nginx:alpine
          depends_on:
            db: {}
        db:
          image: postgres:16-alpine

  - name: long-syntax depends_on null entry
    valid: false
    backendCode: INVALID_DEPENDS_ON
    daemonError: depends_on "db" must be a mapping with condition
    yaml: |
      services:
        web:
          image: nginx:alpine
          depends_on:
            db:
        db:
          image: postgres:16-alpine

  - name: long-syntax depends_on with unknown condition
    valid: false
    backendCode: INVALID_DEPENDS_ON_CONDITION
    daemonError: condition must be service_started, service_healthy, or service_completed_successfully
    yaml: |
      services:
        web:
          image: nginx:alpine
          depends_on:
            db:
              condition: whenever
        db:
          image: postgres:16-alpine

  - name: long-syntax depends_on fields beyond condition
    valid: false
    backendCode: UNSUPPORTED_DEPENDS_ON
    daemonError: depends_on "db" feature "restart" is not supported
    yaml: |
      services:
        web:
          image: nginx:alpine
          depends_on:
            db:
              condition: service_started
              restart: true
        db:
          image: postgres:16-alpine

  - name: depends_on undefined service
    valid: false
    backendCode: UNDEFINED_DEPENDENCY
    daemonError: depends on undefined service "db"
    yaml: |
      services:
        web:
          image: nginx:alpine
          depends_on: [db]

  - name: capitalized boolean external resource
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
      volumes:
        data:
          external: True

  - name: quoted external resource flag
    valid: false
    backendCode: INVALID_RESOURCE_EXTERNAL
    daemonError: external must be boolean
    yaml: |
      services:
        web:
          image: nginx:alpine
      volumes:
        data:
          external: "true"

  - name: service log rotation with json-file and local
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          logging:
            driver: json-file
            options:
              max-size: 200m
              max-file: "5"
        worker:
          image: busybox
          logging:
            driver: local
            options:
              compress: "true"
        quiet:
          image: busybox
          logging:
            driver: none

  - name: logging options written as YAML numbers and booleans
    valid: true
    yaml: |
      services:
        web:
          image: nginx:alpine
          logging:
            options:
              max-size: 10m
              max-file: 3
              compress: True

  - name: logging max-file that is not a whole number
    valid: false
    backendCode: INVALID_LOGGING
    backendMessage: max-file
    daemonError: max-file
    yaml: |
      services:
        web:
          image: nginx:alpine
          logging:
            options:
              max-file: "2.5"

  - name: logging driver that ships logs off the node
    valid: false
    backendCode: INVALID_LOGGING
    backendMessage: json-file, local or none
    daemonError: json-file, local or none
    yaml: |
      services:
        web:
          image: nginx:alpine
          logging:
            driver: syslog
            options:
              syslog-address: udp://10.0.0.1:514

  - name: unsupported logging option
    valid: false
    backendCode: INVALID_LOGGING
    backendMessage: tag
    daemonError: tag
    yaml: |
      services:
        web:
          image: nginx:alpine
          logging:
            options:
              tag: web

  - name: logging driver none with options
    valid: false
    backendCode: INVALID_LOGGING
    backendMessage: none takes no options
    daemonError: none takes no options
    yaml: |
      services:
        web:
          image: nginx:alpine
          logging:
            driver: none
            options:
              max-size: 1m
