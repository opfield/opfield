opfield:
  address: "opfield.example.com:9443"
  # token: "opf_node_..." # Set during install, cleared after enrollment
  cert_sha256: "sha256:<opfield-grpc-leaf-fingerprint>"
tls:
  ca_cert: "/etc/docker-daemon/certs/ca.pem"
  client_cert: "/etc/docker-daemon/certs/node.pem"
  client_key: "/etc/docker-daemon/certs/node-key.pem"
state_dir: "/var/lib/docker-daemon"
log_level: "info"

console:
  enabled: true  # host console; false turns it off (Opfield cannot turn it back on)
  user: ""  # OS user for host console sessions; empty = daemon's user

files:
  enabled: true  # host file access; false turns it off (Opfield cannot turn it back on)

docker:
  socket: "unix:///var/run/docker.sock"
  allowlist: ["*"]  # "*" = all containers, or explicit names
  compose:
    # Optional override. The daemon defaults to Docker's official multi-arch
    # compose-bin image pinned by digest and pulls it when absent.
    sidecar_image: "docker.io/docker/compose-bin@sha256:962d5ea7017e5ef425bfa47e492efa2c27d0492e8af58c497011e73b2ce98ee0"
    command_timeout_seconds: 900
