name: opfield
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OPFIELD_IMAGE_REF:-opfield:local}
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      net.opfield.managed-service: app
    ports:
      - "3000:3000"
    expose:
      - "9443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SECURE_LINK_CONNECTOR_IMAGE=${SECURE_LINK_CONNECTOR_IMAGE:-}
      - BACKUP_RUNNER_IMAGE=${BACKUP_RUNNER_IMAGE:-}
      - DATABASE_URL=postgres://opfield:${DB_PASSWORD}@postgres:5432/opfield
      - REDIS_URL=redis://redis:6379
      - GITHUB_OAUTH_CLIENT_ID
      - SETUP_BOOTSTRAP=${SETUP_BOOTSTRAP:-false}
      - WEB_TLS_BOOTSTRAP_MODE=${WEB_TLS_BOOTSTRAP_MODE:-http}
      - WEB_TLS_AUTO_DIR=${WEB_TLS_AUTO_DIR:-/var/lib/opfield/tls}
      - PKI_MASTER_KEY=${PKI_MASTER_KEY}
      - HEALTH_CHECK_INTERVAL_SECONDS=${HEALTH_CHECK_INTERVAL_SECONDS:-30}
      - ACME_RENEWAL_CRON=${ACME_RENEWAL_CRON:-0 3 * * *}
      - EXPIRY_CHECK_CRON=${EXPIRY_CHECK_CRON:-0 6 * * *}
      - GRPC_PORT=${GRPC_PORT:-9443}
      - GRPC_TLS_AUTO_DIR=${GRPC_TLS_AUTO_DIR:-/var/lib/opfield/tls}
      - SANDBOX_RUNNER_WORKSPACE_DIR=${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/opfield/sandbox-workspaces}
      - GRPC_TLS_CERT=${GRPC_TLS_CERT:-}
      - GRPC_TLS_KEY=${GRPC_TLS_KEY:-}
      - GRPC_TLS_EXTRA_SANS=${GRPC_TLS_EXTRA_SANS:-}
      - OPFIELD_RELAY_REQUIRED=${OPFIELD_RELAY_REQUIRED:-true}
      - OPFIELD_RELAY_MANAGED=${OPFIELD_RELAY_MANAGED:-false}
      - OPFIELD_RELAY_TARGET=${OPFIELD_RELAY_TARGET:-relay:9443}
      - OPFIELD_RELAY_IDENTITY_DIR=/var/lib/opfield-relay
      - OPFIELD_RELAY_IMAGE_REF=${OPFIELD_RELAY_IMAGE_REF:-opfield-relay:local}
      - OPFIELD_RELAY_SERVICE_NAME=relay
      - OPFIELD_RELAY_BUILD_VERSION=${OPFIELD_RELAY_BUILD_VERSION:-dev}
      - OPFIELD_RELAY_PROTOCOL_MAJOR=${OPFIELD_RELAY_PROTOCOL_MAJOR:-1}
      - OPFIELD_REGISTRY_AUTH_DIR=/var/lib/opfield-registry-auth
      - OPFIELD_REGISTRY_TOKEN_SERVICE=opfield-internal-registry
      - PUBLIC_IPV4=${PUBLIC_IPV4:-}
      - PUBLIC_IPV6=${PUBLIC_IPV6:-}
      - APP_VERSION=${OPFIELD_VERSION:-dev}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/var/lib/opfield
      - relay_identity:/var/lib/opfield-relay
      - registry_auth:/var/lib/opfield-registry-auth
      # opfield-managed:start sandbox-workspace
      - ${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/opfield/sandbox-workspaces}:${SANDBOX_RUNNER_WORKSPACE_DIR:-/var/lib/opfield/sandbox-workspaces}
      # opfield-managed:end sandbox-workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      # Inherit the image's bounded, child-process-free health probe.
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  relay:
    image: ${OPFIELD_RELAY_IMAGE_REF:-opfield-relay:local}
    entrypoint: ["/opfield-relay"]
    restart: unless-stopped
    labels:
      net.opfield.managed-service: relay
    environment:
      - RELAY_IDENTITY_DIR=/var/lib/opfield-relay/identity
      - RELAY_STATE_DIR=/var/lib/opfield-relay/state
      - RELAY_APP_GRPC_TARGET=app:9443
      - RELAY_POOL_ID=system
      - RELAY_INSTANCE_ID=00000000-0000-4000-8000-000000000001
    ports:
      - "9443:9443"
    volumes:
      - relay_identity:/var/lib/opfield-relay/identity:ro
      - relay_state:/var/lib/opfield-relay/state
    healthcheck:
      test: ["CMD", "/opfield-relay", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  registry:
    image: ${OPFIELD_REGISTRY_IMAGE_REF:-registry:3}
    restart: unless-stopped
    labels:
      net.opfield.managed-service: registry
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_DEBUG_ADDR: 127.0.0.1:5001
      REGISTRY_LOG_LEVEL: info
      REGISTRY_HTTP_SECRET: ${OPFIELD_REGISTRY_HTTP_SECRET:-opfield-development-registry-secret}
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: ${OPFIELD_REGISTRY_TOKEN_REALM:-https://opfield.invalid/api/docker/registry/token}
      REGISTRY_AUTH_TOKEN_SERVICE: opfield-internal-registry
      REGISTRY_AUTH_TOKEN_ISSUER: opfield-internal-registry
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /var/lib/opfield-registry-auth/token-cert.pem
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_INTERVAL: 10s
      REGISTRY_HEALTH_STORAGEDRIVER_THRESHOLD: "3"
    expose:
      - "5000"
    volumes:
      - registry_data:/var/lib/registry
      - registry_auth:/var/lib/opfield-registry-auth:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/debug/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # A host shutdown stops every container at once. Smart shutdown (SIGTERM) lets the app finish its shutdown drain
    # on its open connections before postgres exits; the image's default (SIGINT) cuts them at once.
    stop_signal: SIGTERM
    stop_grace_period: 75s
    environment:
      POSTGRES_DB: opfield
      POSTGRES_USER: opfield
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opfield -d opfield"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  app_data:
  relay_identity:
  relay_state:
  registry_data:
  registry_auth:
  postgres_data:
  redis_data:
