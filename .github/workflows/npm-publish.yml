name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - '@opfield/logger'
      expected_version:
        description: Exact package.json version expected for publication
        required: true
        type: string
      dry_run:
        description: Validate the package without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    steps:
      - name: Require main for real publication
        if: ${{ !inputs.dry_run }}
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org

      - name: Install a trusted-publishing capable npm CLI
        run: npm install --global 'npm@^11.15.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve and validate package
        id: package
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          case "$PACKAGE_NAME" in
            '@opfield/logger') package_dir='packages/logging-sdk' ;;
            *) echo "Unsupported package: $PACKAGE_NAME" >&2; exit 1 ;;
          esac
          actual_name=$(node -p "require('./${package_dir}/package.json').name")
          actual_version=$(node -p "require('./${package_dir}/package.json').version")
          test "$actual_name" = "$PACKAGE_NAME"
          test "$actual_version" = "$EXPECTED_VERSION"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Test, typecheck, and build package
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          pnpm --filter "$PACKAGE_NAME" test
          pnpm --filter "$PACKAGE_NAME" typecheck
          pnpm --filter "$PACKAGE_NAME" build

      - name: Validate npm package
        if: ${{ inputs.dry_run }}
        working-directory: ${{ steps.package.outputs.package_dir }}
        run: npm publish --access public --dry-run

      - name: Publish npm package with provenance
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ steps.package.outputs.package_dir }}
        run: npm publish --access public
