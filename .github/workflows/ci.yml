name: CI

# The light gate for main: lint, typecheck, the light suite, the database suites and the
# commercial core against this commit, all in parallel. Workflow Image builds the image for the
# same commit; the full end-to-end run belongs to stable releases.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_SKIP_NX_CACHE: '1'

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.4'
          cache-dependency-path: |
            packages/daemons/go.work.sum
            packages/relay/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and check the edition boundary
        run: |
          run() {
            local name=$1
            shift
            "$@" > "${RUNNER_TEMP}/${name}.log" 2>&1
          }
          run lint pnpm lint & lint=$!
          run typecheck pnpm typecheck & typecheck=$!
          run edition node scripts/verify-edition-artifacts.mjs --require-complete & edition=$!
          failed=0
          for name in lint typecheck edition; do
            pid=${!name}
            if wait "$pid"; then status=passed; else status=failed; failed=1; fi
            echo "::group::${name} ${status}"
            cat "${RUNNER_TEMP}/${name}.log"
            echo "::endgroup::"
            [[ "$status" == passed ]] || echo "::error::${name} failed"
          done
          exit "$failed"

  test:
    name: Light suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.4'
          cache-dependency-path: |
            packages/daemons/go.work.sum
            packages/relay/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  database:
    name: Database (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The opt-in PostgreSQL suites (migrations and grant cleanup) on the version installs run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opfield
          POSTGRES_PASSWORD: opfield
          POSTGRES_DB: opfield_migration_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opfield -d opfield_migration_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The inference budget suites also need Redis (OPFIELD_TEST_REDIS_URL): without it they would be skipped.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPFIELD_MIGRATION_TEST_DATABASE_URL: postgres://opfield:opfield@localhost:5432/opfield_migration_test_ci
      OPFIELD_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner's own PostgreSQL client follows the runner image, and a newer major writes dumps PostgreSQL 16
      # rejects (transaction_timeout); the dump and restore suites use the client of the service container instead.
      - name: PostgreSQL 16 client tools
        run: |
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker exec -i %s %s "$@"\n' '${{ job.services.postgres.id }}' "$tool" > "$RUNNER_TEMP/$tool"
            chmod +x "$RUNNER_TEMP/$tool"
          done
          echo "PG_DUMP_BIN=$RUNNER_TEMP/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_BIN=$RUNNER_TEMP/pg_restore" >> "$GITHUB_ENV"

      # Every test file reading the URL, so a new or renamed suite runs without editing this step.
      - name: Opt-in PostgreSQL suites
        working-directory: packages/backend
        run: |
          mapfile -t suites < <(grep -rlE --include='*.test.ts' 'process\.env\.OPFIELD_MIGRATION_TEST_DATABASE_URL\b' src tests | sort)
          [ "${#suites[@]}" -gt 0 ] || { echo 'No opt-in database suites found' >&2; exit 1; }
          printf '%s\n' "${suites[@]}"
          # Every suite recreates the schema of the one test database, so they must not run side by side.
          pnpm exec vitest run "${suites[@]}" --no-file-parallelism \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/database-tests.json"

      # The suites are opt-in; a missing or renamed URL would skip them and still pass.
      - name: Fail on skipped database tests
        run: |
          node -e '
            const report = require(process.argv[1]);
            if (report.numTotalTests === 0 || report.numPendingTests > 0 || report.numTodoTests > 0) {
              console.error(`Database suites did not all run: ${report.numPendingTests} of ${report.numTotalTests} skipped`);
              process.exit(1);
            }
            console.log(`${report.numPassedTests} database tests ran`);
          ' "$RUNNER_TEMP/database-tests.json"

  # The private core checks run in its own repository, so their logs stay private; this job
  # dispatches them against this exact commit and fails when they fail.
  commercial:
    name: Commercial core
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.COMMERCIAL_CI_TOKEN }}
      COMMERCIAL_REPOSITORY: ${{ vars.COMMERCIAL_REPOSITORY || (github.repository_owner == 'opfield' && 'opfield/opfield-commercial' || format('{0}/opfield-commercial', github.repository_owner)) }}
    steps:
      - name: Verify the commercial core against this commit
        run: |
          test -n "$GH_TOKEN" || { echo '::error::COMMERCIAL_CI_TOKEN is not set' >&2; exit 1; }
          title="Verify against host ${GITHUB_SHA}"
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run ci.yml --repo "$COMMERCIAL_REPOSITORY" --ref main -f "host_ref=${GITHUB_SHA}"
          run_id=
          for attempt in $(seq 1 30); do
            run_id=$(
              gh run list --repo "$COMMERCIAL_REPOSITORY" --workflow ci.yml --event workflow_dispatch -L 20 \
                --json databaseId,displayTitle,createdAt \
                --jq "[.[] | select(.displayTitle == \"${title}\" and .createdAt >= \"${since}\")][0].databaseId // empty"
            )
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id" || { echo '::error::The commercial CI run did not start' >&2; exit 1; }
          echo "Commercial CI run ${run_id} (private)"
          gh run watch "$run_id" --repo "$COMMERCIAL_REPOSITORY" --interval 5 --exit-status > /dev/null
