name: Image

# Builds the Opfield image once per main commit, next to CI and without gating it. A release
# tag only stamps this image with its version (release.yml), so tagging never waits on a build.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read
  # Keyless image signing (scripts/release/supply-chain.sh), only used when SIGN_IMAGES is true.
  id-token: write
  packages: write

concurrency:
  group: image-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  # Releases promote these builds from OPFIELD_IMAGE, which also carries the images nodes pin directly (patched
  # SeaweedFS, third-party mirrors). Keep these lines identical in release.yml, which explains them.
  OPFIELD_IMAGE: ${{ vars.OPFIELD_IMAGE || 'ghcr.io/opfield/opfield' }}
  # With the repository variable SIGN_IMAGES=true every image is signed keyless (Sigstore, GitHub OIDC) and carries an
  # SPDX SBOM attestation (docs/verify-releases.md). Keep this line identical in release.yml.
  SIGN_IMAGES: ${{ vars.SIGN_IMAGES }}

jobs:
  opfield:
    name: Opfield image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Set up builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          ./scripts/sync-update-trust-anchor.sh
          docker buildx build \
            --cache-from type=gha,scope=opfield \
            --cache-to type=gha,scope=opfield,mode=max \
            --tag "${OPFIELD_IMAGE}:main-${SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --provenance=false \
            --sbom=false \
            --metadata-file "${RUNNER_TEMP}/image.metadata.json" \
            --push .

      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOM
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: |
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${RUNNER_TEMP}/image.metadata.json")
          scripts/release/supply-chain.sh sign "${OPFIELD_IMAGE}@${digest}"

  # The runner changes rarely; it is rebuilt (under emulation for arm64) only when its source
  # tree changes, and releases pin the build of the tree they carry.
  backup-runner:
    name: Backup runner image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve source tree
        id: tree
        run: echo "hash=$(git rev-parse HEAD:packages/daemons/backup-runner)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Check for an existing build
        id: existing
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          if docker buildx imagetools inspect "${OPFIELD_IMAGE}/backup-runner:tree-${TREE}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up emulation
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up builder
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        if: ${{ steps.existing.outputs.built != 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file packages/daemons/backup-runner/Dockerfile \
            --tag "${OPFIELD_IMAGE}/backup-runner:tree-${TREE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --push packages/daemons/backup-runner

      # Also for an existing build, so the first run with SIGN_IMAGES=true signs the build releases pin.
      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOMs
        if: ${{ env.SIGN_IMAGES == 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          image="${OPFIELD_IMAGE}/backup-runner"
          digest=$(docker buildx imagetools inspect "${image}:tree-${TREE}" --format '{{json .Manifest}}' | jq -er '.digest')
          scripts/release/supply-chain.sh sign "${image}@${digest}"

  # Opfield's patched SeaweedFS (packages/daemons/seaweedfs-image): rebuilt only when that tree
  # changes. The docker daemon pins the digest of the tree's build, so a change to the image is
  # published here first and pinned in a following commit.
  seaweedfs:
    name: SeaweedFS image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve source tree
        id: tree
        run: echo "hash=$(git rev-parse HEAD:packages/daemons/seaweedfs-image)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Check for an existing build
        id: existing
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          source scripts/legacy-compat.sh
          if docker buildx imagetools inspect "${OPFIELD_IMAGE}/${LEGACY_SEAWEEDFS_REPOSITORY}:tree-${TREE}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # The Go binary is cross-compiled on the build platform; the arm64 stage only copies it.
      - name: Build and push
        if: ${{ steps.existing.outputs.built != 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          source scripts/legacy-compat.sh
          scripts/build-seaweedfs-image.sh --push "${OPFIELD_IMAGE}/${LEGACY_SEAWEEDFS_REPOSITORY}:tree-${TREE}"

      - name: Show the digest to pin
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          source scripts/legacy-compat.sh
          docker buildx imagetools inspect "${OPFIELD_IMAGE}/${LEGACY_SEAWEEDFS_REPOSITORY}:tree-${TREE}" --format '{{json .Manifest}}' | jq -r '.digest'

      # Also for an existing build, so the first run with SIGN_IMAGES=true signs the build nodes pin.
      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOMs
        if: ${{ env.SIGN_IMAGES == 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          source scripts/legacy-compat.sh
          image="${OPFIELD_IMAGE}/${LEGACY_SEAWEEDFS_REPOSITORY}"
          digest=$(docker buildx imagetools inspect "${image}:tree-${TREE}" --format '{{json .Manifest}}' | jq -er '.digest')
          scripts/release/supply-chain.sh sign "${image}@${digest}"

  # Opfield's managed PostgreSQL images (packages/daemons/postgres-image/image), one per catalog version of
  # packages/daemons/docker/internal/pgext/catalog/versions.json, and the downloadable extension bundles
  # (packages/daemons/postgres-image/bundle), one per bundle and PostgreSQL major. Each is rebuilt only when its
  # tree changes (a bundle also when PGDG serves a newer version of its extension). The docker daemon accepts a
  # build once its digest is pinned in versions.json or bundles.json, in a following commit.
  postgres-matrix:
    name: PostgreSQL image matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      bundles: ${{ steps.matrix.outputs.bundles }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: List the versions and bundles
        id: matrix
        run: |
          versions=packages/daemons/docker/internal/pgext/catalog/versions.json
          echo "versions=$(jq -c '[.versions[].version]' "$versions")" >> "$GITHUB_OUTPUT"
          ids=$(awk '!/^#/ && NF { print $1 }' packages/daemons/postgres-image/bundle/bundles.list | jq -R . | jq -sc .)
          majors=$(jq -c '[.versions[].major] | unique' "$versions")
          echo "bundles=$(jq -nc --argjson ids "$ids" --argjson majors "$majors" '[$ids[] as $id | $majors[] as $major | {id: $id, major: $major}]')" >> "$GITHUB_OUTPUT"

  postgres:
    name: PostgreSQL image ${{ matrix.version }}
    needs: postgres-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.postgres-matrix.outputs.versions) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve the tag
        id: tag
        env:
          VERSION: ${{ matrix.version }}
        run: echo "tag=${VERSION}-tree-$(git rev-parse HEAD:packages/daemons/postgres-image/image)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Check for an existing build
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "${OPFIELD_IMAGE}/postgres:${TAG}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      # The extension packages are installed in the arm64 image under emulation.
      - name: Set up emulation
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up builder
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        if: ${{ steps.existing.outputs.built != 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ matrix.version }}
        run: scripts/build-postgres-image.sh --push "${OPFIELD_IMAGE}/postgres:${TAG}" "$VERSION"

      # Nodes pull the pinned digest from the repository versions.json names; both carry it.

      - name: Show the digest to pin
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ matrix.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${OPFIELD_IMAGE}/postgres:${TAG}" --format '{{json .Manifest}}' | jq -er '.digest')
          echo "PostgreSQL ${VERSION}: postgres@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOMs
        if: ${{ env.SIGN_IMAGES == 'true' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="${OPFIELD_IMAGE}/postgres"
          digest=$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{json .Manifest}}' | jq -er '.digest')
          scripts/release/supply-chain.sh sign "${image}@${digest}"

  postgres-bundles:
    name: PostgreSQL bundle ${{ matrix.bundle.id }} ${{ matrix.bundle.major }}
    needs: postgres-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(needs.postgres-matrix.outputs.bundles) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The tag names the extension version PGDG serves now; the build installs exactly that package version.
      - name: Resolve the version and tag
        id: tag
        env:
          ID: ${{ matrix.bundle.id }}
          MAJOR: ${{ matrix.bundle.major }}
        run: |
          read -r _ debian package_version version < <(scripts/build-postgres-bundle.sh --resolve "$ID" "$MAJOR")
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-pg${MAJOR}-${debian}-tree-$(git rev-parse HEAD:packages/daemons/postgres-image/bundle)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Check for an existing build
        id: existing
        env:
          ID: ${{ matrix.bundle.id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "${OPFIELD_IMAGE}/postgres-ext/${ID}:${TAG}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up emulation
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up builder
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        if: ${{ steps.existing.outputs.built != 'true' }}
        env:
          ID: ${{ matrix.bundle.id }}
          MAJOR: ${{ matrix.bundle.major }}
          TAG: ${{ steps.tag.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.tag.outputs.package_version }}
        run: scripts/build-postgres-bundle.sh --push "${OPFIELD_IMAGE}/postgres-ext/${ID}:${TAG}" "$ID" "$MAJOR" "$PACKAGE_VERSION"


      # The pin needs the digest, each architecture's installed size (opfield-bundle.json sizeBytes) and what the
      # bundle provides.
      - name: Show the digest and sizes to pin
        env:
          ID: ${{ matrix.bundle.id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="${OPFIELD_IMAGE}/postgres-ext/${ID}:${TAG}"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
          sizes=""
          provides=""
          for arch in amd64 arm64; do
            container=$(docker create --platform "linux/${arch}" "${image%:*}@${digest}" /opfield-bundle)
            manifest=$(docker cp "${container}:/opfield-bundle.json" - | tar -xO)
            sizes="${sizes} ${arch}=$(jq -er '.sizeBytes' <<< "$manifest")"
            provides=$(jq -er '.provides | join(",")' <<< "$manifest")
            docker rm "$container" >/dev/null
            # Docker keeps one platform per pulled index digest: drop it before pulling the next architecture.
            docker image rm "${image%:*}@${digest}" >/dev/null
          done
          echo "${ID} ${TAG}: postgres-ext/${ID}@${digest} sizes${sizes} provides ${provides}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOMs
        if: ${{ env.SIGN_IMAGES == 'true' }}
        env:
          ID: ${{ matrix.bundle.id }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="${OPFIELD_IMAGE}/postgres-ext/${ID}"
          digest=$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{json .Manifest}}' | jq -er '.digest')
          scripts/release/supply-chain.sh sign "${image}@${digest}"

  mirror:
    name: Mirror third-party images
    runs-on: ubuntu-latest
    # The first run copies every listed image; later runs only confirm the mirror tags on GHCR.
    timeout-minutes: 90
    env:
      CRANE_VERSION: v0.22.1
      CRANE_LINUX_AMD64_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Install crane
        run: |
          archive="${RUNNER_TEMP}/go-containerregistry.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/crane"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/crane" crane
          echo "${RUNNER_TEMP}/crane" >> "$GITHUB_PATH"

      - name: Mirror digest-pinned third-party images to GHCR
        env:
          MIRROR_REPOSITORY: ${{ env.OPFIELD_IMAGE }}
        run: node scripts/mirror-third-party-images.mjs

  # Signs every mirrored third-party digest and attaches an SBOM per platform. The signature
  # says Opfield's workflow mirrored that exact digest, not that Opfield built it. Already signed digests are skipped,
  # so only the first run with SIGN_IMAGES=true (or a new pin) does real work.
  mirror-signatures:
    name: Sign mirrored third-party images
    needs: mirror
    if: ${{ vars.SIGN_IMAGES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Install cosign and syft
        run: scripts/release/supply-chain.sh install

      - name: Sign the mirrored digests
        run: |
          mapfile -t pins < <(jq -r '.images[] | "\(.name) \(.source | sub("^.*@"; ""))"' config/third-party-images.json)
          for pin in "${pins[@]}"; do
            name=${pin% *}
            digest=${pin#* }
            scripts/release/supply-chain.sh sign "${OPFIELD_IMAGE}/${name}@${digest}"
          done
