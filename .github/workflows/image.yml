name: Image

# Builds the Opfield image once per main commit, next to CI and without gating it. A release
# tag only stamps this image with its version (release.yml), so tagging never waits on a build.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build (defaults to the dispatched ref)
        required: false
        type: string

permissions:
  contents: read
  # Keyless image signing (scripts/release/supply-chain.sh), only used when SIGN_IMAGES is true.
  id-token: write
  packages: write

concurrency:
  group: image-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  # Releases promote these builds from OPFIELD_IMAGE; the mirror receives the images nodes pin directly (patched
  # SeaweedFS, third-party mirrors). Keep these lines identical in release.yml, which explains them.
  OPFIELD_GHCR: ${{ vars.OPFIELD_GHCR }}
  # legacy-name: vars.GATEWAY_IMAGE, GATEWAY_IMAGE_MIRROR (and GATEWAY_SIGNED_IMAGE), the repository variable names before
  # 2.12.1, read while the OPFIELD_* ones are unset — remove once the owner renamed the repository variables.
  OPFIELD_IMAGE: ${{ vars.OPFIELD_IMAGE || vars.GATEWAY_IMAGE || (vars.OPFIELD_GHCR == 'true' && 'ghcr.io/opfield/opfield' || 'ghcr.io/the-square-labs/gateway') }}
  OPFIELD_IMAGE_MIRROR: ${{ vars.OPFIELD_IMAGE_MIRROR || vars.GATEWAY_IMAGE_MIRROR || (vars.OPFIELD_GHCR == 'true' && 'ghcr.io/the-square-labs/gateway' || '') }}
  # With the repository variable SIGN_IMAGES=true every image is signed keyless (Sigstore, GitHub OIDC) and carries an
  # SPDX SBOM attestation (docs/verify-releases.md). Keep this line identical in release.yml.
  SIGN_IMAGES: ${{ vars.SIGN_IMAGES }}

jobs:
  opfield:
    name: Opfield image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Set up builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          ./scripts/sync-update-trust-anchor.sh
          docker buildx build \
            --cache-from type=gha,scope=opfield \
            --cache-to type=gha,scope=opfield,mode=max \
            --tag "${OPFIELD_IMAGE}:main-${SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --provenance=false \
            --sbom=false \
            --metadata-file "${RUNNER_TEMP}/image.metadata.json" \
            --push .

      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOM
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: |
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${RUNNER_TEMP}/image.metadata.json")
          scripts/release/supply-chain.sh sign "${OPFIELD_IMAGE}@${digest}"

  # The runner changes rarely; it is rebuilt (under emulation for arm64) only when its source
  # tree changes, and releases pin the build of the tree they carry.
  backup-runner:
    name: Backup runner image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve source tree
        id: tree
        run: echo "hash=$(git rev-parse HEAD:packages/daemons/backup-runner)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Check for an existing build
        id: existing
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          if docker buildx imagetools inspect "${OPFIELD_IMAGE}/backup-runner:tree-${TREE}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up emulation
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up builder
        if: ${{ steps.existing.outputs.built != 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push
        if: ${{ steps.existing.outputs.built != 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file packages/daemons/backup-runner/Dockerfile \
            --tag "${OPFIELD_IMAGE}/backup-runner:tree-${TREE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --push packages/daemons/backup-runner

      # Also for an existing build, so the first run with SIGN_IMAGES=true signs the build releases pin.
      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOMs
        if: ${{ env.SIGN_IMAGES == 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          image="${OPFIELD_IMAGE}/backup-runner"
          digest=$(docker buildx imagetools inspect "${image}:tree-${TREE}" --format '{{json .Manifest}}' | jq -er '.digest')
          scripts/release/supply-chain.sh sign "${image}@${digest}"

  # Opfield's patched SeaweedFS (packages/daemons/seaweedfs-image): rebuilt only when that tree
  # changes. The docker daemon pins the digest of the tree's build, so a change to the image is
  # published here first and pinned in a following commit.
  seaweedfs:
    name: SeaweedFS image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve source tree
        id: tree
        run: echo "hash=$(git rev-parse HEAD:packages/daemons/seaweedfs-image)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Check for an existing build
        id: existing
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          if docker buildx imagetools inspect "${OPFIELD_IMAGE}/seaweedfs-gateway:tree-${TREE}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # The Go binary is cross-compiled on the build platform; the arm64 stage only copies it.
      - name: Build and push
        if: ${{ steps.existing.outputs.built != 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: scripts/build-seaweedfs-image.sh --push "${OPFIELD_IMAGE}/seaweedfs-gateway:tree-${TREE}"

      # Nodes pull the pinned digest from the repository the docker daemon names; both carry it.
      - name: Copy to the mirror repository
        if: ${{ env.OPFIELD_IMAGE_MIRROR != '' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          docker buildx imagetools create \
            --tag "${OPFIELD_IMAGE_MIRROR}/seaweedfs-gateway:tree-${TREE}" \
            "${OPFIELD_IMAGE}/seaweedfs-gateway:tree-${TREE}"

      - name: Show the digest to pin
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: docker buildx imagetools inspect "${OPFIELD_IMAGE}/seaweedfs-gateway:tree-${TREE}" --format '{{json .Manifest}}' | jq -r '.digest'

      # Also for an existing build, so the first run with SIGN_IMAGES=true signs the build nodes pin.
      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the build and attach its SBOMs
        if: ${{ env.SIGN_IMAGES == 'true' }}
        env:
          TREE: ${{ steps.tree.outputs.hash }}
        run: |
          image="${OPFIELD_IMAGE}/seaweedfs-gateway"
          digest=$(docker buildx imagetools inspect "${image}:tree-${TREE}" --format '{{json .Manifest}}' | jq -er '.digest')
          also=()
          if [[ -n "$OPFIELD_IMAGE_MIRROR" ]]; then
            also=(--also "${OPFIELD_IMAGE_MIRROR}/seaweedfs-gateway")
          fi
          scripts/release/supply-chain.sh sign "${image}@${digest}" "${also[@]}"

  mirror:
    name: Mirror third-party images
    runs-on: ubuntu-latest
    # The first run copies every listed image; later runs only confirm the mirror tags on GHCR.
    timeout-minutes: 90
    env:
      CRANE_VERSION: v0.22.1
      CRANE_LINUX_AMD64_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Install crane
        run: |
          archive="${RUNNER_TEMP}/go-containerregistry.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/crane"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/crane" crane
          echo "${RUNNER_TEMP}/crane" >> "$GITHUB_PATH"

      - name: Mirror digest-pinned third-party images to GHCR
        env:
          MIRROR_REPOSITORY: ${{ env.OPFIELD_IMAGE }}
        run: node scripts/mirror-third-party-images.mjs

      # Nodes and the installer pull third-party images from the earlier repository; both carry them.
      - name: Mirror them to the mirror repository too
        if: ${{ env.OPFIELD_IMAGE_MIRROR != '' }}
        env:
          MIRROR_REPOSITORY: ${{ env.OPFIELD_IMAGE_MIRROR }}
        run: node scripts/mirror-third-party-images.mjs

  # Signs every mirrored third-party digest in both repositories and attaches an SBOM per platform. The signature
  # says Opfield's workflow mirrored that exact digest, not that Opfield built it. Already signed digests are skipped,
  # so only the first run with SIGN_IMAGES=true (or a new pin) does real work.
  mirror-signatures:
    name: Sign mirrored third-party images
    needs: mirror
    if: ${{ vars.SIGN_IMAGES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Install cosign and syft
        run: scripts/release/supply-chain.sh install

      - name: Sign the mirrored digests
        run: |
          mapfile -t pins < <(jq -r '.images[] | "\(.name) \(.source | sub("^.*@"; ""))"' config/third-party-images.json)
          for pin in "${pins[@]}"; do
            name=${pin% *}
            digest=${pin#* }
            also=()
            if [[ -n "$OPFIELD_IMAGE_MIRROR" ]]; then
              also=(--also "${OPFIELD_IMAGE_MIRROR}/${name}")
            fi
            scripts/release/supply-chain.sh sign "${OPFIELD_IMAGE}/${name}@${digest}" "${also[@]}"
          done
