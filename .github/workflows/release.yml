name: Release

# An Opfield tag only promotes the image built for its commit on main (workflow Image): it
# stamps the version and the backup runner, signs the digest, packages the commercial core and
# publishes the release. Main CI already ran the light suite on the commit; stable tags add the
# backup-runner smoke before the image becomes :latest.
on:
  push:
    tags:
      - 'v*'
      - '!v*-wiolett.*'

permissions:
  actions: read
  contents: write
  # Keyless image signing (scripts/release/supply-chain.sh), only used when SIGN_IMAGES is true.
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  # Image repositories (scripts/release/image-repositories.sh, docs/development.md). With the repository variable
  # OPFIELD_GHCR=true ghcr.io/opfield/opfield is the primary and the one signed manifests name (OPFIELD_SIGNED_IMAGE),
  # and ghcr.io/the-square-labs/gateway, the earlier repository, receives every release tag with the same digest.
  # OPFIELD_IMAGE, OPFIELD_IMAGE_MIRROR and OPFIELD_SIGNED_IMAGE (repository variables) override them for forks.
  # GHCR_PUSH_TOKEN (secret) is a token that can write packages in both organizations; without it the workflow
  # token is used. Keep these lines identical in image.yml.
  OPFIELD_GHCR: ${{ vars.OPFIELD_GHCR }}
  # legacy-name: vars.GATEWAY_IMAGE, GATEWAY_IMAGE_MIRROR (and GATEWAY_SIGNED_IMAGE), the repository variable names before
  # 2.12.1, read while the OPFIELD_* ones are unset — remove once the owner renamed the repository variables.
  OPFIELD_IMAGE: ${{ vars.OPFIELD_IMAGE || vars.GATEWAY_IMAGE || (vars.OPFIELD_GHCR == 'true' && 'ghcr.io/opfield/opfield' || 'ghcr.io/the-square-labs/gateway') }}
  OPFIELD_IMAGE_MIRROR: ${{ vars.OPFIELD_IMAGE_MIRROR || vars.GATEWAY_IMAGE_MIRROR || (vars.OPFIELD_GHCR == 'true' && 'ghcr.io/the-square-labs/gateway' || '') }}
  OPFIELD_SIGNED_IMAGE: ${{ vars.OPFIELD_SIGNED_IMAGE || vars.GATEWAY_SIGNED_IMAGE }}
  # With the repository variable SIGN_IMAGES=true every image is signed keyless (Sigstore, GitHub OIDC) and carries an
  # SPDX SBOM attestation; the SBOMs are also release assets (docs/verify-releases.md). This is in addition to the
  # Ed25519-signed update manifests, which do not change. Keep this line identical in image.yml.
  SIGN_IMAGES: ${{ vars.SIGN_IMAGES }}

jobs:
  opfield:
    name: Opfield release
    if: >-
      ${{ !(endsWith(github.ref_name, '-relay') || endsWith(github.ref_name, '-nginx') ||
      endsWith(github.ref_name, '-docker') || endsWith(github.ref_name, '-monitoring') ||
      endsWith(github.ref_name, '-watchdog')) }}
    runs-on: ubuntu-latest
    # The commercial core run, with its own verification when the CI marker is missing, is part of it.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve tag
        id: tag
        run: |
          # The annotated tag carries the release notes.
          git fetch --no-tags --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          scripts/release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" >> "$GITHUB_OUTPUT"
          echo "runner_tree=$(git rev-parse "${GITHUB_REF_NAME}^{commit}:packages/daemons/backup-runner")" >> "$GITHUB_OUTPUT"

      - name: Require an Opfield tag
        env:
          RELEASE_KIND: ${{ steps.tag.outputs.kind }}
        run: test "$RELEASE_KIND" = opfield

      # Setup commands of this release download opfield-node-installers.sha256 through the update Worker, which serves
      # only the installer names it knows: a Worker deployed before that name answers 404 for every node install.
      # Workers that serve it report service opfield-updates on /health.
      - name: Require an update Worker that serves the installer checksum list
        run: |
          health=$(curl -fsS --retry 3 --max-time 30 https://updates.thesqlabs.com/health || true)
          if ! grep -q '"service":"opfield-updates"' <<<"$health"; then
            echo '::error::Deploy packages/update-service (pnpm --filter @opfield/update-service deploy) before this release: the update Worker does not serve opfield-node-installers.sha256' >&2
            exit 1
          fi

      - name: Resolve image repositories
        run: |
          source scripts/release/image-repositories.sh
          echo "OPFIELD_SIGNED_IMAGE=${OPFIELD_SIGNED_IMAGE}" >> "$GITHUB_ENV"
          echo "Primary ${OPFIELD_IMAGE}, mirror ${OPFIELD_IMAGE_MIRROR:-none}, manifests name ${OPFIELD_SIGNED_IMAGE}"

      - name: Verify product continuity grant
        run: node scripts/verify-continuity-grant.mjs

      - name: Require successful main CI
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          run_id=$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")][0].id // empty'
          )
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run exists for ${SHA}" >&2
            exit 1
          fi
          echo "Main CI run ${run_id} passed for ${SHA}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.4'
          cache-dependency-path: packages/daemons/go.work.sum

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || github.token }}

      - name: Set up builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Wait for the commit's images
        id: images
        env:
          SHA: ${{ steps.tag.outputs.sha }}
          RUNNER_TREE: ${{ steps.tag.outputs.runner_tree }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest'
          }
          base="${OPFIELD_IMAGE}:main-${SHA}"
          runner="${OPFIELD_IMAGE}/backup-runner:tree-${RUNNER_TREE}"
          for attempt in $(seq 1 120); do
            if base_digest=$(digest_of "$base") && runner_digest=$(digest_of "$runner"); then
              echo "base=${OPFIELD_IMAGE}@${base_digest}" >> "$GITHUB_OUTPUT"
              echo "runner=${OPFIELD_IMAGE}/backup-runner@${runner_digest}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            failed=$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/image.yml/runs?head_sha=${SHA}&per_page=20" \
                --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion != "success")] | length'
            )
            ongoing=$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/image.yml/runs?head_sha=${SHA}&per_page=20" \
                --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length'
            )
            if [[ "$failed" != 0 && "$ongoing" == 0 ]]; then
              echo "::error::Workflow Image failed for ${SHA}; rerun it, then this release" >&2
              exit 1
            fi
            echo "Waiting for ${base} and ${runner} (${attempt})"
            sleep 10
          done
          echo "::error::Images for ${SHA} did not appear within 20 minutes" >&2
          exit 1

      # Only the version tags: :latest follows once the release is complete.
      - name: Stamp and push the release image
        id: image
        env:
          BASE_IMAGE: ${{ steps.images.outputs.base }}
          RUNNER_IMAGE: ${{ steps.images.outputs.runner }}
        run: |
          context="${RUNNER_TEMP}/stamp"
          mkdir -p "$context"
          node scripts/bundle-backup-runner.mjs "$GITHUB_REF_NAME" "$RUNNER_IMAGE" "${context}/backup-runner-image.json"
          docker buildx build \
            --file docker/release.Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "APP_VERSION=${GITHUB_REF_NAME}" \
            --tag "${OPFIELD_IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${OPFIELD_IMAGE}:${GITHUB_REF_NAME#v}" \
            --provenance=false \
            --sbom=false \
            --metadata-file "${RUNNER_TEMP}/image.metadata.json" \
            --push "$context"
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "${RUNNER_TEMP}/image.metadata.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "${OPFIELD_IMAGE}/backup-runner:${GITHUB_REF_NAME}" "$RUNNER_IMAGE"
          echo "Published ${OPFIELD_IMAGE}@${digest}"
          if [[ -n "$OPFIELD_IMAGE_MIRROR" ]]; then
            # skopeo keeps the manifest, so the mirror tags carry the signed digest (imagetools create would re-wrap it).
            for t in "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME#v}"; do
              skopeo copy --all --preserve-digests "docker://${OPFIELD_IMAGE}@${digest}" "docker://${OPFIELD_IMAGE_MIRROR}:${t}"
            done
            docker buildx imagetools create --tag "${OPFIELD_IMAGE_MIRROR}/backup-runner:${GITHUB_REF_NAME}" "$RUNNER_IMAGE"
            echo "Mirrored ${OPFIELD_IMAGE}@${digest} to ${OPFIELD_IMAGE_MIRROR}"
          fi

      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Sign the release images and write their SBOMs
        if: ${{ env.SIGN_IMAGES == 'true' }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          RUNNER_IMAGE: ${{ steps.images.outputs.runner }}
        run: |
          sboms="${RUNNER_TEMP}/sboms"
          mkdir -p "$sboms"
          also=()
          runner_also=()
          if [[ -n "$OPFIELD_IMAGE_MIRROR" ]]; then
            also=(--also "$OPFIELD_IMAGE_MIRROR")
            runner_also=(--also "${OPFIELD_IMAGE_MIRROR}/backup-runner")
          fi
          scripts/release/supply-chain.sh sign "${OPFIELD_IMAGE}@${DIGEST}" \
            --sbom "${sboms}/opfield-${GITHUB_REF_NAME}.spdx.json" "${also[@]}"
          scripts/release/supply-chain.sh sign "$RUNNER_IMAGE" \
            --sbom "${sboms}/backup-runner-${GITHUB_REF_NAME}.spdx.json" "${runner_also[@]}"

      - name: Smoke-test the bundled backup runner
        if: ${{ steps.tag.outputs.prerelease != 'true' }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          RUNNER_IMAGE: ${{ steps.images.outputs.runner }}
        run: node scripts/test-backup-runner-release.mjs "${OPFIELD_IMAGE}@${DIGEST}" "$RUNNER_IMAGE"

      - name: Sign update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          test -n "${UPDATE_SIGNING_PRIVATE_KEY_PEM_B64}" || {
            echo 'UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 is required' >&2
            exit 1
          }
          ./scripts/sync-update-trust-anchor.sh
          (
            cd packages/daemons
            go run ./shared/cmd/update-trust sign \
              --kind gateway-image \
              --version "$GITHUB_REF_NAME" \
              --tag "$GITHUB_REF_NAME" \
              --image "$OPFIELD_SIGNED_IMAGE" \
              --digest "$DIGEST" \
              --git-commit-sha "$SHA" \
              --git-pipeline-id "$GITHUB_RUN_ID" \
              --out ../../gateway-image.update.json
          )

      # Witness process binaries (a Keeper voter relays run for availability sets) ship with the
      # Opfield release, signed as kind witness-binary; relays fetch them through the update Worker.
      - name: Build and sign witness artifacts
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
          GIT_COMMIT_SHA: ${{ steps.tag.outputs.sha }}
        run: scripts/release/witness-artifacts.sh "$GITHUB_REF_NAME" "${RUNNER_TEMP}/witness-artifacts"

      # The signed list of license service addresses (config/license-service.json) installations fetch daily; the
      # update Worker serves it from the latest stable release and .github/workflows/license-endpoints.yml re-signs it
      # there weekly. Off until the repository variable LICENSE_ENDPOINTS_PUBLISH is true.
      - name: Sign the license endpoints document
        if: ${{ vars.LICENSE_ENDPOINTS_PUBLISH == 'true' }}
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
        run: node scripts/release/license-endpoints.mjs "${RUNNER_TEMP}/license-endpoints/license-endpoints.json"

      - name: Prepare the draft GitHub release
        env:
          RELEASE_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            printf 'Opfield release %s\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            args=(--title "Opfield ${GITHUB_REF_NAME}" --notes-file release-notes.md)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--prerelease=false)
            fi
            gh release edit "$GITHUB_REF_NAME" "${args[@]}"
          else
            args=(--draft --verify-tag --title "Opfield ${GITHUB_REF_NAME}" --notes-file release-notes.md)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
          # Every installer the node setup commands of this release download, with their checksums.
          installers_dir="${RUNNER_TEMP}/installers"
          scripts/stage-installers.sh "$GITHUB_REF_NAME" "$installers_dir"
          assets=(CONTINUITY-GRANT.md gateway-image.update.json "$installers_dir"/* "${RUNNER_TEMP}/witness-artifacts"/*)
          license_endpoints="${RUNNER_TEMP}/license-endpoints/license-endpoints.json"
          if [[ -f "$license_endpoints" ]]; then
            assets+=("$license_endpoints")
          fi
          if [[ -d "${RUNNER_TEMP}/sboms" ]]; then
            assets+=("${RUNNER_TEMP}/sboms"/*.spdx.json)
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<<"$uploaded"
          done

      # Packages the commercial core against this exact release and waits for it: that run installs
      # the core on the license server, so paid installs can update as soon as the release is public.
      # Needs COMMERCIAL_CI_TOKEN (actions:write on the commercial repository).
      - name: Package the commercial core
        env:
          GH_TOKEN: ${{ secrets.COMMERCIAL_CI_TOKEN }}
          COMMERCIAL_REPOSITORY: ${{ vars.COMMERCIAL_REPOSITORY || (github.repository_owner == 'opfield' && 'opfield/opfield-commercial' || format('{0}/opfield-commercial', github.repository_owner)) }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::COMMERCIAL_CI_TOKEN is not set' >&2; exit 1; }
          title="Package commercial core ${GITHUB_REF_NAME}"
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --repo "$COMMERCIAL_REPOSITORY" --ref main \
            -f "host_ref=${GITHUB_REF_NAME}" \
            -f "host_version=${GITHUB_REF_NAME}" \
            -f publish=true
          run_id=
          for _ in $(seq 1 30); do
            run_id=$(
              gh run list --repo "$COMMERCIAL_REPOSITORY" --workflow release.yml --event workflow_dispatch -L 20 \
                --json databaseId,displayTitle,createdAt \
                --jq "[.[] | select(.displayTitle == \"${title}\" and .createdAt >= \"${since}\")][0].databaseId // empty"
            )
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id" || { echo '::error::The commercial core run did not start' >&2; exit 1; }
          echo "Commercial core run ${run_id} (private)"
          if ! gh run watch "$run_id" --repo "$COMMERCIAL_REPOSITORY" --interval 10 --exit-status > /dev/null; then
            echo "::error::The commercial core run ${run_id} failed; the release stays a draft" >&2
            exit 1
          fi

      - name: Point latest at the release image
        if: ${{ steps.tag.outputs.prerelease != 'true' }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # latest is the signed release digest itself, in both repositories.
          skopeo copy --all --preserve-digests "docker://${OPFIELD_IMAGE}@${DIGEST}" "docker://${OPFIELD_IMAGE}:latest"
          if [[ -n "$OPFIELD_IMAGE_MIRROR" ]]; then
            skopeo copy --all --preserve-digests "docker://${OPFIELD_IMAGE}@${DIGEST}" "docker://${OPFIELD_IMAGE_MIRROR}:latest"
          fi

      # A stable Opfield release is the repository's Latest: releases/latest/download serves its installers.
      - name: Publish GitHub release
        env:
          RELEASE_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi

  component-release:
    name: Component release
    if: >-
      ${{ endsWith(github.ref_name, '-relay') || endsWith(github.ref_name, '-nginx') ||
      endsWith(github.ref_name, '-docker') || endsWith(github.ref_name, '-monitoring') ||
      endsWith(github.ref_name, '-watchdog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GHCR_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
      UPDATE_SIGNING_PRIVATE_KEY_PEM_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Require successful main CI
        run: |
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          run_id=$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")][0].id // empty'
          )
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run exists for ${sha}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.4'
          cache-dependency-path: |
            packages/daemons/go.work.sum
            packages/relay/go.sum

      - name: Install cosign and syft
        if: ${{ env.SIGN_IMAGES == 'true' }}
        run: scripts/release/supply-chain.sh install

      - name: Build, sign, publish, and release component
        run: scripts/github-release.sh
